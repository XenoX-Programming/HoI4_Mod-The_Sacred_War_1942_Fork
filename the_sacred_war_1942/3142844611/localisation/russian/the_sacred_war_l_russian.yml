 TURNING_TIDE_NAME: "Священная война" #NT!
 TURNING_TIDE_DESC: "Идет битва за Кавказ, и похоже, что Советский Союз потерпел поражение. Турецкие войска приближаются со стороны Грузии. Итальянская кампания в Восточной Африке была очень кровавой. Битва за Средиземное море нерешительна. На Дальнем Востоке Япония борется с Китаем и Советским Союзом. Американский флот восстанавливается после нападения на Перл-Харбор" #NT!
 ENG_TURNING_TIDE_DESC: "Позор под Дюнкерком и падение Египта вместе с Суэцким каналом стали большим ударом для Империи. Однако героическая и безумная защита Мальты от итальянских войск (март 1942 г.) придала британцам дополнительную волю к борьбе. После великого поражения британская армия возрождается и готова атаковать Египет. Немцы, готовясь к операции «Фолл Блау», покинули Египет, оставив там только итальянцев и французов. Итальянские легкие танки, разгромившие британскую армию, теперь не имеют шансов против новых британских средних танков." #NT!
 FRA_TURNING_TIDE_DESC: "Французская Социальная Республика была основана в 1941 году, когда маршал Петен был отправлен в отставку немцами за отказ объявить войну Великобритании. Дорио решил назвать государство «Социальной Республикой» и провел просоциалистические экономические реформы, чтобы заручиться поддержкой социалистов. Консерваторы и правые политики не поддерживают нынешний режим во Франции." #NT!
 GER_TURNING_TIDE_DESC: "Триумф Третьего Рейха уже не за горами, поскольку антикоммунистический крестовый поход приближается к своему завершению. Несмотря на подавляющее численное преимущество противника, Вермахт продолжает наступление, захватывая новые города Советского Союза. Британская империя вот-вот потеряет всякую надежду перед лицом этих безжалостных побед." #NT!
 ITA_TURNING_TIDE_DESC: "Королевство Италии одержало победу в Александрии, а затем на Ниле, взяв в плен тысячи британцев и египтян. Однако скорость наступления снизилась и остановилась на юге Египта, где британцы установили новую линию обороны. В Восточной Африке итальянцы в кровопролитной битве захватили Найроби. Соединенные Штаты присоединились к войне, и это поворотный момент в Африке, потому что теперь Италии придется защищаться." #NT!
 JAP_TURNING_TIDE_DESC: "Империя Восходящего Солнца находится в конфликте с Советским Союзом, США и Китайской Республикой. Нападение на Перл-Харбор считается самым значительным военным триумфом в истории. Тем не менее, американский флот находится в процессе восстановления." #NT!
 SOV_TURNING_TIDE_DESC: "Последние два года стали катастрофическим периодом для Советского Союза с ошеломляющими потерями, составившими 8 миллионов человек. Красная Армия потерпела сокрушительное поражение от немецкой армии. Стратегическое значение Азербайджана, важнейшего источника нефти для Советского Союза, вызывает опасения, поскольку он может попасть в руки врага." #NT!
 USA_TURNING_TIDE_DESC: "Флот Соединенных Штатов оказался практически полностью уничтожен в результате печально известного нападения Японии на Перл-Харбор. Однако это не означало прекращения участия Америки в войне. США сохраняют свои позиции обладателя крупнейшей в мире промышленности и значительных запасов нефти." #NT!
 OTHER_TURNING_TIDE_DESC: "Народы мира, большие и малые, будут затронуты этим конфликтом, охватывающим несколько континентов по всему миру." #NT!
