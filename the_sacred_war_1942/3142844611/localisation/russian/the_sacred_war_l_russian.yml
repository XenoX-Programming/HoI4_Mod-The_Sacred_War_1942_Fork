 #################### EVENTS 
 lore_events.1.t: "Победа?" #NT!
 lore_events.1.desc: "Итальянская стратегия во Второй мировой войне была основана на легких танках, которым Муссолини доверял во время гражданской войны в Испании. Королевская армия практически в одиночку разгромила деморализованные британские войска в Египте, но захват Суэца не заставил Британскую империю капитулировать. Умные британцы построили отличную оборону в южных районах Египта, которую, несмотря на многочисленные попытки итальянцев, захватить не удалось. Война находится в тупике с 1940 года, а западные союзники становятся только сильнее. Муссолини прекрасно понимает, что война для его страны проиграна, только чудо может спасти Италию от катастрофы." #NT!
 lore_events.1.a: "Аванти Италия!" #NT!
 lore_events.2.t: "Зиг?" #NT!
 lore_events.2.desc: "Перед разделом Чехословакии немецкий дипломат дал «разрешение» Польской Республике оккупировать Словакию в рамках секретных польско-германских переговоров. Гитлер решил сотрудничать со словаками и спровоцировать польско-словацкую войну, в которой Польша является нападающей стороной. Польша попала в эту ловушку, и Польская армия напала на территорию Словакии, возмутив Запад. Это разрушило польско-французский союз и поддержку Польши Западом. В сентябре 1939 года Франция оказалась в сложной политической ситуации, объявив 7 сентября войну Германии, тогда французское общество было расколото и еще более неподготовлено к войне. Франция проиграла войну и подписала сепаратистский мирный договор с Германией, по которому Франция должна была превратиться в «Веймарскую республику», униженную и ограбленную. Однако британцы «предложили» Гитлеру лучшую идею. Британцы напали на французский флот и разожгли антибританские настроения во Франции. Гитлер передумал и решил подписать новый мирный договор, чтобы Новая Франция была не «униженным» государством, а верным союзником Германского рейха. Французская Социальная Республика объявила войну Британской империи шесть месяцев спустя, когда британцы потеряли Египет. Японская империя напала на восточные территории Советского Союза, что не позволило Советскому Союзу провести контрнаступление. А Вермахт движется дальше" #NT!
 lore_events.2.a: "Победа – это мы!" #NT!
 lore_events.3.t: "Самый темный час" #NT!
 lore_events.3.desc: "Британская империя потерпела ряд сокрушительных поражений. В Дюнкерке немцы взяли в плен 140 000 англо-французов. Эвакуация не имела полного успеха. Многие британские солдаты погибли в море. Затем британская армия вместе с египетской армией потерпела поражение в Египте, потеряв 100 000 человек. Первая британская «Победа» пришла только при обороне Луксора на юге Египта: британско-египетские части безумно защищали храм фараонов от итальянских легких танков. Битва за Британию обошлась ВВС Великобритании чрезвычайно дорого, но фронт в Египте и Восточной Африке был заморожен и хорошо защищен." #NT!
 lore_events.3.a: "Боже, храни Империю." #NT!
 lore_events.4.t: "Родина зовет нас" #NT!
 lore_events.4.desc: "22 июня началась «Священная война». Красная Армия потерпела огромное поражение в первые месяцы войны. В декабре 1941 года Зимнее наступление было предотвращено японской агрессией. Вермахт оккупировал Сталинград, и нефтяные месторождения Азербайджана находятся в опасности. Немцы начали артиллерийский обстрел Кремля. Турецкая армия при поддержке итальянцев атаковала Кавказ через Грузию и Армению. Операция «Серебряная лисица» прошла успешно, и Мурманск может быть захвачен, что может уменьшить англо-американскую поддержку Советского Союза." #NT!
 lore_events.4.a: "Священные слова Москва позади! \nМы помним время Бородино." #NT!
 lore_events.5.t: "Для императора!" #NT!
 lore_events.5.desc: "Империя Восходящего Солнца одерживает величайшую победу в своей истории. Япония воюет с Советским Союзом, Китаем и США. Нападение на Перл-Харбор было блестящим и лишило США мощной силы, позволившей Империи доминировать над последующими новыми островами в Тихом океане." #NT!
 lore_events.5.a: "Япония будет властителем всей Азии!" #NT!
 lore_events.6.t: "Мы помним Перл-Харбор!" #NT!
 lore_events.6.desc: "7 декабря США подверглись нападению со стороны Японской империи. Умные японцы уничтожили американский Тихоокеанский флот, лишив Америку ее величайшей силы. Европейские державы оси доминировали на старом континенте. Советский Союз падает, и только США могут освободить мир от зла" #NT!
 lore_events.6.a: "Мы можем сделать это!" #NT!
 lore_events.7.t: "Раздел Чехословакии" #NT!
 lore_events.7.desc: "Немецкий дипломат предоставил «разрешение» Республике Польша оккупировать Словакию в рамках секретных польско-германских переговоров. Гитлер решил сотрудничать со словаками и спровоцировать польско-словацкую войну, в которой Польша является нападающей стороной. Польша попала в эту ловушку, и Польская армия напала на территорию Словакии, возмутив Запад. Это разрушило польско-французский союз и поддержку Польши Западом. Польские дивизии покинули Словакию после кровавых инцидентов со словацкой армией." #NT!
 lore_events.7.a: "Интересный" #NT!
 lore_events.8.t: "гражданская война в Испании" #NT!
 lore_events.8.desc: "Муссолини прекратил отправлять все свое оборудование в Испанию, где, по нашему мнению, закончились итальянские запасы, необходимые для войны. Муссолини оценил мощь тамошних танков и решил инвестировать в них. в 1939 году Германский рейх прекратил помощь националистической Испании, когда были обнаружены его антинемецкие настроения. Испанские фашисты «Испанская Фаланга» сделали то же самое и с этого момента перешли в оппозицию франкистам. Однако Франко выиграл гражданскую войну, которая продлилась 6 месяцев." #NT!
 lore_events.8.a: "Интересный" #NT!
 lore_events.9.t: "Китайско-японская война" #NT!
 lore_events.9.desc: "Муссолини поддержал Китайскую Республику благодаря уступке, которую Китай дал Италии. Италия расширила свою торговлю (вольфрамом) и получила несколько китайских портов. Китайская Республика приняла итальянских советников-атташе, где итальянцы помогали китайцам разработать новую военную доктрину. Таким образом, это усложнило альянс оси Берлин-Рим-Токио. Япония завоевала важнейшие промышленные центры Китая, но не может продолжать наступление вглубь Китая. Китай усилил свою армию итальянской артиллерией и способен проводить значимые контратаки на фронте." #NT!
 lore_events.9.a: "Интересный" #NT!
 lore_events.10.t: "Вторжение в Польшу" #NT!
 lore_events.10.desc: "Польша как можно дольше продлевала переговоры с Германией, пытаясь решить их мирным путем. Многие поляки выступали за передачу Гданьска Германии. Польша отказалась от предложений Германии и подверглась нападению со стороны Германии и СССР. Франция и Великобритания объявили войну Германии, сославшись на польско-французский союз, который ранее был подорван французским правительством. В «Результате» французское общественное мнение было еще более антивоенным, чем в нашем графике. Немецкая оккупационная политика становится легче, а сотрудничество Польши расширяется." #NT!
 lore_events.10.a: "Интересный" #NT!
 lore_events.11.t: "Блицкриг" #NT!
 lore_events.11.desc: "Франция проиграла войну и подписала сепаратистский мирный договор с Германией, по которому Франция должна была превратиться в «Веймарскую республику», униженную и ограбленную. Однако британцы «предложили» Гитлеру лучшую идею. Британцы напали на французский флот и разожгли антибританские настроения во Франции. Гитлер передумал и решил подписать новый мирный договор, чтобы Новая Франция была не «униженным» государством, а верным союзником Германского рейха. Британский экспедиционный корпус не смог эвакуироваться, и многие британцы попали в плен." #NT!
 lore_events.11.a: "Интересный" #NT!
 lore_events.12.t: "Кампания Египта" #NT!
 lore_events.12.desc: "Итальянцы присоединились к войне такой, какой она была в нашей хронологии. Итальянская армия смогла захватить Александрию. Британские танки были слабее итальянских, и каждый бой был катастрофой для британских бронетанковых войск. Англичане установили хорошую оборону на Ниле и имели численное преимущество над итальянцами, но это им не помогло и они были разбиты немецкими танками, которые были даже лучше итальянских и сумели прорвать линию обороны англичан. Падение Каира вызвало упадок боевого духа британских войск и половина воевавших там англичан попала в плен к итальянцам, Битва за Египет длилась 64 дня. Британцы установили новую линию обороны на юге Египта, которая была прочно укреплена и не разгромлена. Благодаря захвату Суэца итальянцы стали оказывать поддержку Итальянской Восточной Африке. Через несколько дней Французская Социальная Республика объявила войну Британской империи." #NT!
 lore_events.12.a: "Интересный" #NT!
 lore_events.13.t: "Битва за Мальту" #NT!
 lore_events.13.desc: "Итальянские войска начали высадку десанта на Мальте. Несмотря на отчаянную и нетрадиционную оборону британцев, им удалось успешно отразить атаку. Мальтийская крепость стала кладбищем для 25 000 итальянских солдат. Эта доблестная оборона британцев была провозглашена их современными Фермопилами и послужила мощным пропагандистским материалом. Муссолини, разгневанный неудачей, приказал уничтожить Мальту. В ответ объединенные итало-германские ВВС начали разрушительную воздушную атаку на остров, задействовав 550 тактических бомбардировщиков, чтобы уничтожить любую цель в поле зрения." #NT!
 lore_events.13.a: "Интересный" #NT!
 lore_events.14.t: "Операция Барбаросса" #NT!
 lore_events.14.desc: "22 июня ознаменовало начало «Священной войны». В первые месяцы конфликта Красная Армия столкнулась с серьезным поражением. К декабрю 1941 года Зимнее наступление было сорвано из-за японской агрессии. Сталинград пал перед Вермахтом, поставив под угрозу нефтяные запасы Азербайджана. Немецкая артиллерия начала обстрел Кремля. При поддержке итальянцев турецкая армия начала наступление на Кавказ через Грузию и Армению. Операция «Серебряная лисица» увенчалась успехом, создав угрозу Мурманску и потенциально уменьшив англо-американскую помощь Советскому Союзу." #NT!
 lore_events.14.a: "Интересный" #NT!
 lore_events.15.t: "Япония и Перл-Харбор" #NT!
 lore_events.15.desc: "Японская империя объявила войну Советскому Союзу (4 октября), а через 2 месяца напала на Перл-Харбор, что стало невероятным успехом для Японии. Тихоокеанский флот США был уничтожен в порту, потеряв большую часть своих линкоров и авианосцев." #NT!
 lore_events.15.a: "Интересный" #NT!
 lore_events.16.t: "Битва за Москву: Победа Красной Армии!" #NT!
 lore_events.16.desc: "Во Второй битве за Москву город сталкивается с немецким натиском, и Красная Армия выходит победителем как защитники родины. \nКаждая улица и площадь Москвы становятся полем боя, и, несмотря на огромное давление, Красная Армия героически защищает свою столицу. Стены Кремля, символ стойкости, остаются нетронутыми, а советские солдаты становятся живым доказательством неприступного бастиона. \nПеред лицом этого сопротивления немецкая военная машина останавливается в самом сердце страны, и Москва остается свободной. Победа Красной Армии над немецким натиском знаменует собой поворотный момент в истории Второй битвы под Москвой, символизируя непобедимую силу и стойкость советского народа перед лицом величайших угроз." #NT!
 lore_events.16.a: "Проклятые красные" #NT!
 lore_events.16.b: "Мы помним Бородинскую битву! [SOV.GetFlag]" #NT!
 lore_events.16.c: "Интересный" #NT!
 lore_events.17.t: "Битва за Москву: Победа немецкой армии!" #NT!
 lore_events.17.desc: "Улицы Москвы, которые когда-то были полем ожесточенных столкновений, теперь приветствуют победоносную немецкую армию. Красная площадь, свидетельница многочисленных исторических событий, переходит под контроль Германии. Однако опустошенная и деградировавшая Москва перестает быть величественным городом довоенных времен. \nРуины Кремля, когда-то символа советской непобедимости, теперь повествуют историю разрушений. Город наполнен трагическими сценами, когда тела солдат Красной Армии лежат на улицах, напоминая зрителям об исключительной жестокости войны. Grande Armée для борьбы с голодом." #NT!
 lore_events.17.a: "Падение Красного Царского Дома!" #NT!
 lore_events.17.b: "Москва будет за нами!" #NT!
 lore_events.17.c: "Интересный" #NT!
 lore_events.18.t: "Начало второй битвы за Москву" #NT!
 lore_events.18.desc: "Вторая битва за Москву начинается, когда Германия начинает атаку, формируя линии на окраинах города. Москва, свидетель прошлых конфликтов, становится центром этой жестокой борьбы, привлекая внимание всего мира к этой стратегической точке, где будут решаться судьбы Восточного фронта.\nМосква, известная своим героическим прошлым, становится полем битвы, где Германия стоит перед окончательной задачей захвата российской столицы. Однако на их пути стоит грозная Красная Армия под командованием маршала Рокоссовского, использующая свое численное преимущество. Выиграет ли Германия, став хозяином Москвы, или численно превосходящая Красная Армия Рокоссовского окажется непреодолимым препятствием?" #NT!
 lore_events.18.a: "Хорошо" #NT!
 lore_events.19.t: "Наступление на Калинин" #NT!
 lore_events.19.desc: "Сталин приказал высшему командованию отбить город Калинин. Калинин – очень важный город для безопасности Москвы. В Калинине есть ценные для нас промышленные предприятия." #NT!
 lore_events.19.a: "Москва наносит ответный удар!" #NT!
 lore_events.20.t: "Польская армия в Советском Союзе" #NT!
 lore_events.20.desc: "Политбюро, осознавая необходимость сотрудничества, представило комплексный план по формированию специализированных польских дивизий, которые будут сражаться плечом к плечу с Красной Армией против общего врага. В ответ на политику призыва Германии в западные регионы Польши, где они заставляют поляков вступать в немецкую армию, многие поляки решают сопротивляться и бежать с территорий, контролируемых Германией. Эти поляки, ищущие убежища и возможности бороться за свою свободу, находят гостеприимное убежище в рядах Красной Армии. \n\n Польские дивизии вместе с Красной Армией будут участвовать как в наступательных, так и в оборонительных действиях, стремясь нарушить немецкие линии снабжения, вернуть оккупированные территории и ослабить контроль Германии над этой территорией. Сотрудничество польских частей и Красной Армии будет направлено на достижение скоординированных успехов в борьбе с немецкими оккупационными силами." #NT!
 lore_events.20.a: "Славяне теперь едины" #NT!
 lore_events.21.t: "Изменения в бою" #NT!
 lore_events.21.desc: "В этом моде: \nРазведка легких танков и бронетехники была улучшена. \nРакетная артиллерия (бригада), средняя и тяжелая самоходная артиллерия были усилены. \nOP Путь Фольксштурма в Mobile Warfare был ослаблен (свободная рабочая сила), и у Германии больше нет партизанской тактики.\nМассовое нападение было усилено.\nКонцентрированная промышленность была усилена.\n nСоветский Союз разблокировал снайперов (рота поддержки)" #NT!
 lore_events.21.a: "Хорошо" #NT!
 lore_events.22.t: "Изменения в советском генералитете в годы войны." #NT!
 lore_events.22.desc: "Нападение японской армии на дислоцированные части на Дальнем Востоке привело к падению репутации Жукова. Армия Жукова собиралась отступить для поддержки Европейского фронта, но тут японцы атаковали и захватили Владивосток. В декабре 1941 года генерал Рокосовский защищал Москву и получил звание Маршала Советского Союза. Красная Армия не смогла организовать контрнаступление и защитить Москву от немецкой угрозы из-за японского нападения с востока. \nНиколай Ватутин и Василий Чуйков, возглавлявшие оборону Сталинграда, покончили жизнь самоубийством после потери города. \n\n «Глава армии» представляет мэра-маршала Советского Союза, который имеет наибольшее влияние на Красную Армию (сразу после Сталина)." #NT!
 lore_events.22.a: "Хорошо" #NT!
 lore_events.23.t: "Расширение Войска Польского на Востоке" #NT!
 lore_events.23.desc: "Свежесформированные польские дивизии готовы противостоять угрозе немецкого варварства. Эти решительные отряды стали свидетельством стойкости и духа польского народа, восставшего против репрессивных сил, которые стремятся его подчинить. Обладая общей приверженностью защите своей родины, эти дивизии готовы участвовать в борьбе против немецких агрессоров, воплощая неукротимую волю польского народа. Готовясь к решению предстоящих задач, эти вновь созданные подразделения несут в себе надежды и чаяния людей, стойких в своем сопротивлении тирании." #NT!
 lore_events.23.a: "Да здравствует Польская Народная Армия!" #NT!
 lore_events.24.t: "Куйбышев – новая столица?" #NT!
 lore_events.24.desc: "Москва в опасности. Вражеские войска вновь угрожают резиденции Советского правительства. Годом ранее Сталин приказал разместить в Куйбышеве некоторые государственные учреждения. Должны ли мы сделать это на этот раз?" #NT!
 lore_events.24.a: "Ситуация серьезная" #NT!
 lore_events.24.b: "Москва выдержит второй выстрел!" #NT!
 lore_events.25.t: "Наступление на Сталинград" #NT!
 lore_events.25.desc: "Сталин приказал высшему командованию отбить Священный город Советского Союза." #NT!
 lore_events.25.a: "Мы вернем эти руины!" #NT!
 lore_events.26.t: "Наступление на Ростов" #NT!
 lore_events.26.desc: "Иосиф Сталин издал новую военную директиву, поставив перед нами важнейшую задачу по освобождению Ростова в течение следующих 90 дней. Значение Ростова в контексте советского Кавказа невозможно переоценить. Несмотря на тяжелые условия, состоящие из крови, грязи и снега, срочность этой миссии очевидна. Успех наших сил в обеспечении безопасности Ростова будет иметь далеко идущие последствия для общего стратегического ландшафта, поэтому нам необходимо преодолеть препятствия и достичь этой жизненно важной цели в установленные сроки. Жертвы, принесенные в этом стремлении, являются свидетельством непоколебимой приверженности достижению наших военных целей и обеспечению будущего Советского Союза." #NT!
 lore_events.26.a: "Ростов-на-Дону вернется на Родину!" #NT!
 lore_events.27.t: "Хорошие результаты советских женщин-снайперов" #NT!
 lore_events.27.desc: "Репортажи из нашей армии наполнены замечательными историями успеха женщин-снайперов, в том числе Людмилы Павличенко, Татьяны Костыриной, Нины Петровой, Алии Молдагуловой, Розы Шаниной и Зибы Ганиевой. Эти опытные стрелки зарекомендовали себя как грозная сила, сеющая хаос в рядах противника и оказывающая значительное влияние на поле боя. Их точность, смелость и решимость стали источником вдохновения для наших сил, поскольку они продолжают вносить свой вклад в разрушительные удары по врагу. Достижения этих женщин-снайперов подчеркивают неоценимую роль, которую женщины играют в защите нашей родины и обеспечении победы нашего дела." #NT!
 lore_events.27.a: "Дочери Родины!" #NT!
 lore_events.30.t: "Секретные переговоры с турецким правительством" #NT!
 lore_events.30.desc: "Положение Турции во Второй мировой войне сейчас очень тяжелое, турецкое общество не поддерживает войну с Советским Союзом, но правительство объявило нам войну под давлением итальянцев и немцев. Правительство Турции не видит возможности вывести свою страну из этой войны. Турция окружена. Туркам пришла в голову идея, что турецкая армия дезертирует и перейдет на нашу сторону. Это безумная идея, которая сделает Турцию государством, оккупированным странами Оси. Турки боятся репрессий и судьбы своих семей, поэтому есть второе предложение – тайное соглашение между турецкой армией и Красной Армией о сведении боевых действий между собой к нулю. Что нам делать?" #NT!
 lore_events.30.a: "Мы подписываем Секретный пакт с турецкой армией" #NT!
 lore_events.30.b: "Вся Армия должна сдаться Красной Армии." #NT!
 lore_events.30.c: "Какое нам дело до твоей судьбы?" #NT!
 lore_events.31.t: "Турецкая армия сдается Советам." #NT!
 lore_events.31.desc: "Положение Турции во время Второй мировой войны было очень тяжелым, турецкое общество не поддерживало войну с Советским Союзом и союз с Италией, но правительство вступило в войну под давлением итальянцев и немцев. Турецкое правительство не видит возможности вывести свою страну из этой войны. Турецкая армия, уставшая от войны, сдалась Красной Армии, подписала секретный Белый мир с Советским Союзом, но за этим последовали немецко-итальянские агенты, и Объединенные армии Оси начали жестокое вторжение в Турцию." #NT!
 lore_events.31.a: "Интересный" #NT!
 lore_events.32.t: "Сталинград окутан дымом" #NT!
 lore_events.32.desc: "После ожесточенного боя Сталинград стоит разрушенным городом, окутанным дымом войны. Этот символический город, ставший ареной одного из самых кровопролитных сражений войны, сегодня представляет собой картину разрушений и трагедий. Руины зданий и остатки ожесточенных боев напоминают нам об огромной цене, которую заплатило население города во время этого болезненного противостояния. Сталинград, хотя и разрушен, остается вечным свидетелем героической обороны и трагических событий, произошедших во время этой долгой битвы." #NT!
 lore_events.32.a: "немецкий новый порядок," #NT!
 lore_events.33.t: "Испания в Оси" #NT!
 lore_events.33.desc: "С распадом Советского Союза мы сможем убедить больше стран присоединиться к нашей стороне. Испания была бы заинтересована присоединиться, если бы мы пообещали ей контроль над Гибралтаром и французскими владениями в Марокко." #NT!
 lore_events.33.a: "Попросите их присоединиться" #NT!
 lore_events.33.b: "Не" #NT!
 lore_events.34.t: "Испания в Оси" #NT!
 lore_events.34.d: "Немцы завоевали весь Советский Союз и теперь предлагают нам союз против того, что осталось от союзников." #NT!
 lore_events.34.a: "У нас больше нет сил остановить немцев..." #NT!
 lore_events.34.b: "Мусор" #NT!
 lore_events.35.t: "Речь Сталина в Москве." #NT!
 lore_events.35.desc: "В тени обороны Москвы, за спинами тысяч красноармейцев. Сталин поговорил с россиянами, решившими остаться в столице. «Наша Родина разгромила монгольскую орду, французскую орду, победит фашистскую орду!»" #NT!
 lore_events.35.a: "Урра!" #NT!
 lore_events.36.t: "Зимнее наступление в Африке" #NT!
 lore_events.36.desc: "Перед лицом ослабления итальянской армии в пустынной местности Северной Африки Британская империя готовится к решительным действиям, чтобы прорвать итальянскую оборону и открыть путь на Каир. Это стратегическое наступление призвано изменить ход войны на этом театре военных действий и позволить союзникам захватить важный пустынный регион.\nОсновная цель этого наступления — прорвать оборону Италии, открыв путь на Каир. Успех предоставит Британской империи ключевое преимущество в регионе, что позволит продолжить продвижение на средиземноморском фронте.\n Теперь, находясь в обороне, итальянская армия сталкивается с решительным британским нападением, в то время как немецкие войска активно участвуют в боевых действиях на Восточном фронте. Ограниченный доступ к поддержке со стороны Германии ставит перед итальянскими командирами сложный выбор, вынуждая их защищать свои позиции." #NT!
 lore_events.36.a: "Интересный" #NT!
 lore_events.37.t: "Армия Муссолини удерживает Египет" #NT!
 lore_events.37.desc: "Все указывает на то, что наступление союзников не отбило Каир у итальянцев. В Африке наступила тишина, не слышно артиллерийских снарядов. В Италии Муссолини произнес речь перед итальянской армией: «Мы будем защищать Египет изо всех сил». Мы превратим Египет в кладбище англо-американцев, пока вся Африка не станет итальянской». В итальянский дух возвращается энтузиазм, угасший в Италии после неудачных предыдущих наступлений (Мальта, Найроби, Северный Судан)." #NT!
 lore_events.37.a: "Англо-американцы не пройдут" #NT!
 lore_events.37.b: "Проклятые итальянцы" #NT!
 lore_events.37.c: "Интересный" #NT!
 lore_events.38.t: "Освобождение Каира" #NT!
 lore_events.38.desc: "Египетский песок, долгое время залитый кровью солдат, стал местом триумфа союзников над итальянской армией.\nПосле многих героических сражений решительные силы союзников разгромили итальянскую армию, превратив египетские поля сражений в арену их триумф.\n\n Какие последствия будет иметь это поражение для фашистского правления в Риме и для всего африканского фронта? Время покажет, смогут ли союзники использовать эту победу для разгрома сил Оси." #NT!
 lore_events.38.a: "Проклятые англосаксы" #NT!
 lore_events.38.b: "Победа Свободы" #NT!
 lore_events.38.c: "Интересный" #NT!
 lore_events.39.t: "Операция «Факел»: высадка американцев на побережьях Французской Северной Африки" #NT!
 lore_events.39.desc: "В рамках операции «Факел» Вооружённые силы США успешно проводят высадку на берегах Французского Марокко и Алжира, меняя расстановку сил в регионе. Высадка не только открывает новый фронт против стран Оси, но и создает угрозу итальянским владениям в Северной Африке. \nВ ходе операции американские войска встречают минимальное сопротивление со стороны французских войск, что еще больше укрепляет их позиции на этом решающем театре военных действий. Даст ли это стратегическое вмешательство ожидаемые результаты или судьба операции «Факел» сделает неожиданный поворот?" #NT!
 lore_events.39.a: "Интересный" #NT!
 lore_events.41.t: "Гражданская война в Италии" #NT!
 lore_events.41.desc: "На фоне растущего недовольства и потери веры в фашистские идеалы и Муссолини как их икону Италия оказывается на грани внутреннего конфликта. Люди перестали верить в фашистские идеологии, а напряженность внутри общества достигла критической точки. \n\nГражданская война в Италии — результат отказа от давних устоев фашизма и упадка власти Муссолини. Общество, больше не разделяемое единодушно по идеологическим принципам, теперь стоит перед выбором – придерживаться существующих убеждений или искать новый путь будущего страны." #NT!
 lore_events.41.a: "Ох" #NT!
 lore_events.42.t: "Гражданская война в Италии" #NT!
 lore_events.42.desc: "На фоне растущего недовольства и потери веры в фашистские идеалы и Муссолини как их икону Италия оказывается на грани внутреннего конфликта. Люди перестали верить в фашистские идеологии, а напряженность внутри общества достигла критической точки. \n\nГражданская война в Италии — результат отказа от давних устоев фашизма и упадка власти Муссолини. Общество, больше не разделяемое единодушно по идеологическим принципам, теперь стоит перед выбором – придерживаться существующих убеждений или искать новый путь будущего страны." #NT!
 lore_events.42.a: "Интересный!" #NT!
 lore_events.43.t: "Освобождение Сталинграда" #NT!
 lore_events.43.desc: "Героическая жертва советских солдат сметает немецкую оккупацию со Сталинграда, а руины города свидетельствуют о беспощадной борьбе и мести. Немецкие войска, вынужденные отступить непоколебимой мощью Красной Армии, уступают место огню освобождения. Несмотря на разруху, жители Сталинграда празднуют приход Красной Армии как символ победы над тиранией. Каждый выстрел и взрыв в городе становятся гимном восстановления и возмездия, восстанавливающего дух нации, которую немецкое оккупационное правление стремилось сокрушить." #NT!
 lore_events.43.a: "Интересный" #NT!
 lore_events.44.t: "Освобождение Севастополя." #NT!
 lore_events.44.desc: "В результате ожесточенных боев и интенсивной артиллерийской подготовки Красной Армии в героической борьбе был освобожден от немецкой оккупации Севастополь. Хотя город пострадал в ходе боев и бомбардировок, его жители с благодарностью встречают Красную Армию как своих освободителей. Немецкие войска, ожесточённо сопротивляясь, были вынуждены уступить решимости Красной Армии, что позволило местному населению вернуть себе свободу. Каждый шаг после освобождения обещает лучшее будущее, несмотря на разрушения, оставленные жестокими столкновениями." #NT!
 lore_events.44.a: "Интересный" #NT!
 lore_events.45.t: "Освобождение Смоленска." #NT!
 lore_events.45.desc: "В результате ожесточенных боев и интенсивной артиллерийской подготовки Красной Армии в героической борьбе был освобожден от немецкой оккупации Смоленск. Несмотря на разрушения, вызванные боями и бомбардировками, жители с благодарностью встречают Красную Армию. Немецкие войска, особенно украинская дивизия Ваффен-СС, оказали значительное сопротивление, но решимость Красной Армии взяла верх, что позволило местному населению вернуть себе свободу." #NT!
 lore_events.45.a: "Интересный" #NT!
 lore_events.46.t: "Освобождение Минска" #NT!
 lore_events.46.desc: "В драматической симфонии войны Смоленск, осажденный жестокостью немецкой оккупации, стал местом героической борьбы. Красная Армия, преодолев немецкую жестокость, освободила город. Несмотря на потери, жители приветствуют своих красных освободителей. Каждый шаг после освобождения обещает лучшее будущее, несмотря на разрушения, оставленные жестокостью Германии." #NT!
 lore_events.46.a: "Интересный" #NT!
 lore_events.47.t: "Освобождение Киева" #NT!
 lore_events.47.desc: "В ключевой момент истории Киев, надежно защищенный немцами, пал перед Красной Армией, которая сорвала планы немцев по удержанию города. Бой был ожесточенным, но решимость Красной Армии и слаженная стратегия принесли победу. Немецкие войска должны признать поражение, когда флаг Красной Армии триумфально развеется над захваченными районами. Однако вместе с освобождением приходит и горький вкус разрушений, которые война оставила в разрушенном городе. Когда киевляне вкусят свободу, перед ними также стоит задача восстановления и связанные с этим проблемы." #NT!
 lore_events.47.a: "Интересный" #NT!
 lore_events.48.t: "Была создана Французская освободительная армия." #NT!
 lore_events.48.desc: "В ответ на репрессивное правление Французской Социальной Республики и с целью освобождения Родины от фашистского режима возникла Французская Освободительная Армия. Эта героическая сила объединяет граждан, которые стремятся вернуть независимость и восстановить демократию во Франции. \nЦель Армии освобождения — свергнуть репрессивный режим и восстановить национальный суверенитет. Ее солдаты, проникнутые духом свободы, решительно противостоят режиму, готовые пожертвовать всем, чтобы вернуть свободу и достоинство своей страны. \nБорьба Французской освободительной армии — это не просто вооруженный конфликт, но и борьба за ценности, которые всегда были основой французского общества." #NT!
 lore_events.48.a: "Интересный" #NT!
 lore_events.49.t: "Освобождение Харькова" #NT!
 lore_events.49.desc: "Красная Армия смело вошла в Харьков, вынудив немецкую армию быстро отступить в глубь Украины. Город, ранее поддавшийся немецкой оккупации, теперь празднует освобождение от вражеского ига. \nКрасная Армия при поддержке танков закрепила свою решимость, прорвав немецкую оборонительную линию вокруг Харькова. Эта стратегическая победа меняет ход войны на Восточном фронте, вынуждая немцев принимать трудные решения перед лицом растущего давления советского наступления. \nХарьков, когда-то ставший свидетелем ожесточенных сражений, теперь с энтузиазмом приветствует освободителей. Когда немецкие войска уходят, улицы города начинают оживать после разрушений войны, и граждане радуются восстановлению своей свободы." #NT!
 lore_events.49.a: "Интересный" #NT!
 lore_events.50.t: "Освобождение Ростова." #NT!
 lore_events.50.desc: "Красная Армия решительно вошла в Ростов-на-Дону, освободив город от немецкой оккупации. \nГород празднует возвращение на свободу: Красная Армия при поддержке мощных бронетанковых и механизированных сил отбирает Ростов-на-Дону из рук немцев. Однако вслед за отступающими немцами военная синагога в Ростове-на-Дону становится жертвой разрушения, поскольку враг повергает ее в землю. /nПри отходе на Украину немцы, вынужденные покинуть город, не стесняются применять решительные меры, разрушая символические сооружения. Ростов-на-Дону, несмотря на восстановление своей свободы, несет цену разрушений, оставленных отступающими немецкими войсками." #NT!
 lore_events.50.a: "Интересный" #NT!
 lore_events.51.t: "Серьезное заседание Генерального штаба Красной Армии." #NT!
 lore_events.51.desc: "В секретном бункере Генерального штаба Красной Армии состоялось серьезное совещание, на котором Иосиф Сталин выразил обеспокоенность и разочарование сложившейся ситуацией на Восточном фронте, в том числе падением Сталинграда, продолжающимся окружением Ленинграда и действиями противника. подход к Москве. \nСталин также выразил сомнение в эффективности действующей доктрины глубокой битвы. \n\nВ ходе встречи маршал Рокоссовский выразил убежденность в том, что Доктрина глубокого боя еще имеет потенциал, но необходимо адаптировать ее к меняющейся ситуации на фронте.\n Рокоссовский постулировал, что Красная Армия должна развивать мотострелковые дивизии он был бы мобильным и достаточно бронированным, что позволяло бы эффективно атаковать фашистские позиции. \nМаршал подчеркнул, что пехота должна поддерживать тесный контакт с противником, сводя к минимуму шансы применения немцами артиллерии и авиации против своих войск. \nНесмотря на разочарование ситуацией, Рокоссовский был полон решимости адаптировать стратегию Красной Армии для повышения эффективности наступательных операций. \n\nВ ходе встречи маршал Георгий Жуков выразил уверенность в том, что Доктрина глубокого боя остается эффективным инструментом, но в то же время предложил внести изменения в стратегию войны. Жуков подчеркивал необходимость массовой мобилизации населения, ведения войны по принципу изнурения противника. Из-за промышленных ограничений Советского Союза Жуков рекомендовал начать логистическо-партизанскую войну. По мнению Жукова, решающее значение будет иметь поддержка партизанских движений, которые разрушат железнодорожные пути и построят укрепления. \nБолее того, Жуков указал на необходимость подготовки солдат к ведению боевых действий в различных погодных и рельефных условиях, а также сосредоточить внимание на производстве танков, которые можно было бы производить быстро и эффективно действовать в ключевые моменты конфликта." #NT!
 lore_events.51.a: "Маршал Рокоссовский прав" #NT!
 lore_events.51.b: "Маршал Жуков прав" #NT!
 lore_events.52.t: "Восстание на Балканах" #NT!
 lore_events.52.desc: "Югославские партизаны под руководством Иосипа Броз Тито организовали широкомасштабное восстание по всему Балканскому региону. Повстанческое движение было направлено на то, чтобы разрушить и ликвидировать контроль Оси, что привело к значительному ущербу важнейшей инфраструктуре и железнодорожным линиям на Балканах. Партизанская тактика и стойкость партизан бросили серьезный вызов силам Оси, ознаменовав заметную главу в сопротивлении оккупации в регионе." #NT!
 lore_events.52.a: "Придурки" #NT!
 lore_events.55.t: "Блокада Ленинграда снята." #NT!
 lore_events.55.desc: "Блокада Ленинграда была окончательно снята. Красная Армия, преодолев немецкие оборонительные рубежи, сумела прорваться к окруженному городу. Многомесячная блокада и страдания ленинградцев подошли к концу, когда советские войска прорвали немецкие укрепления, восстановив связь с остальной частью страны. Этот прорывной момент означал не только военную победу, но и прекращение агонии населения города и восстановление нормальной жизни в регионе." #NT!
 lore_events.55.a: "Интересный" #NT!
 lore_events.57.t: "Героизм Чуйкова" #NT!
 lore_events.57.desc: "Василий Чуйков, генерал 62-й армии Советского Союза, изо всех сил яростно защищавший Сталинград, встретил свой конец в городе в последний день боя. Когда немцы закрепились на правом берегу Волги, проникнув в восточную часть Сталинграда, Василий Чуйков и его ближайшие соратники взяли в руки оружие и лично сражались с гитлеровцами. Василий Чуйков погиб в Сталинграде 19/20 октября 1942 года. Его тело, вероятно, было брошено в Волгу." #NT!
 lore_events.57.a: "Родина тобой гордится" #NT!
 lore_events.58.t: "Карро Армато L6/42" #NT!
 lore_events.58.desc: "На протяжении всей войны итальянцам не удалось создать эффективные и надежные средние танки. Вместо этого они полагались на средние танки, поставленные им немцами или приобретенные у противника. Иногда случались даже ситуации, когда советские танки Т-34 появлялись на фронте в Египте. Со времен гражданской войны в Испании легкие танки были разработаны и достаточно развиты, чтобы противостоять британским средним танкам." #NT!
 lore_events.58.a: "Хорошо" #NT!
 lore_events.64.t:0 "Антисоветские настроения в Центральной Азии"
 lore_events.64.desc:0 "В Центральной Азии антисоветские настроения растут, углубляясь вместе с растущим недовольством населения советским доминированием. Наблюдается рост движений сопротивления и стремления к независимости, что делает регион все более нестабильным. Кроме того, Движение сопротивления подпитывается немцами и турками, которые поддерживают местные оппозиционные группы против советского присутствия."
 lore_events.64.a:0 "Сволочи!"
 lore_events.65.t:0 "Освободительное движение Бухары"
 lore_events.65.desc:0 "Освободительное движение Бухары, возглавляемое местными активистами и патриотами, ставит целью создание независимого государства в Центральной Азии. Его члены активно выступают против нашей оккупации, полагая, что распад Советского Союза возможен из-за наступающих немецкие войск. Их усилия направлены на достижение суверенитета Бухары и освобождение от нашего господства".
 lore_events.65.a:0 "Сволочи!"
 lore_events.66.t:0 "Иосиф Сталин исчез"
 lore_events.66.desc:0 "Во время ожесточенного боя с немецко-фашистскими войсками внезапное и загадочное отсутствие Сталина, лидера Советского Союза. Сталина никто не видел в течение 10 дней, и несмотря на интенсивные поиски, проводимые НКВД , его судьба остается неизвестной. Спекуляции о его судьбе разнообразны, но среди населения бытует мнение, что он, возможно, стал жертвой убийства. Исчезновение Сталина вызывает много вопросов и опасений, особенно перед лицом решающей роли, которую он сыграл в руководя обороной нашей страны».
 lore_events.66.a:0 "Покушение на Сталина?"
 lore_events.67.t:0 "Государственный переворот Красной Армии"
 lore_events.67.desc:0 "Начали действовать высшие офицеры и генералы Красной Армии, частям Красной Армии удалось взять под контроль ключевые стратегические точки страны (Куйбышев, Горький, Казань и Свердловск). Местные военные гарнизоны , лояльные новому руководству, быстро передать контроль над этими центрами.\nВ то же время вспыхнули столкновения между подразделениями НКВД, подчиненными предыдущей власти, и повстанцами, поддержавшими переворот. происходит во многих городах и прилегающих районах, что приводит к потерям с обеих сторон.\nВ ответ на развитие событий глава НКВД Лаврентий Берия отдает приказ своим войскам НКВД, приказав им мобилизоваться и присоединиться к перевороту.Это решение значительно увеличивает силу и охват движения, осуществляемого заговорщиками.\nВ то же время подконтрольное повстанцам Радио Москвы передает специальные сообщения о готовности подписать перемирие с Германией.Это необычное заявление вызывает ряд реакций и противоречия как внутри страны, так и за рубежом. \nПеред лицом политических и милитаристских беспорядков, вызванных переворотом, Советский Военный Совет объявляет, что теперь он будет управлять Советским Союзом. Это знаковое заявление направлено на восстановление стабильности и порядка в стране перед лицом растущего хаоса».
 lore_events.67.a:0 "Еще одна революция?"
 lore_events.68.t:0 "Московская конференция"
 lore_events.68.desc:0 "В Москве, контролируемой немцами, была проведена мирная конференция с целью подписания договора, положившего конец немецко-советской войне. Приоритетом Германии было установление границы по линии Астрахань-Архангельск, которая проходит от Астрахани на юге до Архангельска на севере.Однако после длительных переговоров Гитлер согласился на некоторые уступки.Новая немецкая линия границы проходит в обход таких городов, как Саратов,Горький,Казань,Куйбышев и Астрахань.Это решение было связано с тем, что что немцы заметили огромное сопротивление славян и поняли, что удержать контроль над столь обширными территориями будет сложно из-за частых нападений партизан. «Горький мир» был подписан».
 lore_events.68.a:0 "Конец войны..."
 lore_events.69.t:0 "Мир на Дальнем Востоке"
 lore_events.69.desc:0 "На Московской конференции не было представительства Японии, что свидетельствовало о том, что эта страна не была включена в мирное соглашение ни с Германией, ни с СССР.\nСоветский Военный Совет решил сосредоточить свои усилия на получении Идея заключалась в том, чтобы убедить их в том, что Советский Союз, хотя и завершил борьбу с Германией на Восточном фронте, все еще имеет возможность и готовность вести регулярную войну с Японией. .\nЯпонцы отказались от прежней идеи расширения сферы своего влияния на запад, в сторону озера Байкал. Вместо этого они довольствовались территориями на Дальнем Востоке, а именно Трансамурской областью, островом Сахалин и южной частью Камчатки».
 lore_events.69.a:0 "ОК"
 lore_events.70.t:0 "Новая директива Ставки"
 lore_events.70.desc:0 "Для партийного руководства крайне важно, чтобы Красная Армия победила. И Рокоссовский, и Жуков находятся в сложной ситуации, поэтому мы должны сделать все, чтобы обеспечить победу Сталина. \n\nПервая идея - сосредоточьтесь на Михайловке, в районе Сталинграда, потому что мы считаем, что у нашей армии там больше всего шансов на победу, особенно против венгерских и итальянских дивизий, которые занимают ключевые позиции в этом районе.\nВторая идея - сосредоточиться на Калинине, в Калининский район. Мы считаем, что это самый трудный вариант для наших войск, но это будет самая приятная победа для Советского Союза и обеспечит безопасность фланга Москвы. \nТретья идея - Астрахань - Астраханский округ, мы считаем, что это лучший вариант вариант, может быть, и не проще, но он откроет логистику для освобождения Кавказа».
 lore_events.70.a:0 "Михайловское наступление"
 lore_events.70.b:0 "Калинино-Клинское наступление"
 lore_events.70.c:0 "Астраханское наступление"
 lore_events.71.t:0 "Новая директива Ставки"
 lore_events.71.desc:0 ""
 lore_events.71.a:0 "Михайловское наступление"
