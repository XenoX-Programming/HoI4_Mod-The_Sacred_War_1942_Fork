 Stalins_Paranoia_Reborns_desc: "Наши военные поражения заставили Иосифа Сталина усомниться в компетентности своих генералов, и ему приходится во всех случаях беспокоить своих генералов, часто принимая решения за них. НКВД проверяет каждого генерала на предмет того, не является ли он фашистским агентом." #NT!
 we_are_army_of_the_people_spirit: "§YМы — Армия народа§!" #NT!
 ITA_demoralized_army: "Деморализованная армия" #NT!
 ITA_demoralized_army_desc: "Итальянцы — нация, жаждущая успеха, однажды убежденная фашистскими властями в том, что война будет недолгой. Прошло почти три года, а конец войны кажется недостижимым. Итальянские солдаты отправляются как пушечное мясо в Кению, Мальту, Россию и Египет. Италия оказалась в конфликте с Соединенными Штатами, страной, которую любят итальянцы, где проживают их семьи. Нежелание войны подогревается осознанием того, что противник технологически более развит, чем Италия, во всех аспектах. В этой затяжной борьбе Италия постоянно проигрывает." #NT!
 FRA_konsekwencje_upadku_francji: "Падение материковой Франции" #NT!
 FRA_konsekwencje_upadku_francji_desc: "Быстрое поражение Франции стало шоком для французов, которые не желали войны и не решались помочь Польше. Теперь они оказались под фашистским режимом в Европе. Свободная Франция, с другой стороны, изо всех сил пыталась получить международное признание. Соединенные Штаты неохотно признали Свободную Францию, вернув при этом французские территории в Центральной и Северной Америке, а также Гайану. Вторжение британских и союзных войск во Французскую Западную Африку способствовало созданию Свободной Франции." #NT!
