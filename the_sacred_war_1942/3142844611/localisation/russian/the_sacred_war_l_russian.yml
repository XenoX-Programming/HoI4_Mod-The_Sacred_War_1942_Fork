 imperial_protection: "Британская защита" #NT!
 imperial_protection_desc: "Война стала трагедией для Британской империи. Империя должна использовать все возможные средства для защиты. Британской империи придется отплатить за это в будущем." #NT!
 Armistice_of_22_June_1940: "Перемирие от 22 июня 1940 г." #NT!
 Armistice_of_22_June_1940_desc: "Изначально условия мира были направлены на то, чтобы уничтожить французскую оружейную и гражданскую промышленность. Унизить французов и довести людей до нищеты, которую Версальский договор принес Германии. Однако военная ситуация изменила мнение немцев, и договор был смягчен только до стратегического сырья и заводов." #NT!
 FRA_antistate_resistance: "Антифашистское сопротивление" #NT!
 FRA_antistate_resistance_desc: "Французское общество объединилось против нового фашистского режима. Они имеют широкую поддержку в обществе и тормозят отрасль." #NT!
 FRA_fascist_communist_ally: "Союз с коммунистами" #NT!
 FRA_fascist_communist_ally_desc: "Консерваторы и некоторые националисты (сторонники Петена) не хотят поддерживать новое правительство, поэтому Дорио, бывший коммунист, решил провести социалистические реформы, чтобы заручиться поддержкой социалистов." #NT!
 FSR_socialist_economy: "Социалистическая экономика" #NT!
 FSR_corporatist_economy: "Корпоративная экономика" #NT!
 TUR_in_axis: "Турция в Оси" #NT!
 TUR_in_axis_desc: "В 1930-х и 1940-х годах Италия Муссолини проводила протурецкую политику, направленную на то, чтобы привлечь Турцию под итальянское влияние. Муссолини неоднократно посещал Турцию и по собственной инициативе подписывал дружественные соглашения. Когда Греция была завоевана, он предложил Турции часть греческих островов, но Анкара отказалась. в 1942 году Турецкая Республика присоединилась к Оси и объявила войну Советскому Союзу. Это хорошая возможность для Турции подавить курдское сопротивление и отказаться от долга." #NT!
 TUR_ITA_cooperation: "Итало-турецкое сотрудничество" #NT!
 CHI_ITA_cooperation: "Китайско-итальянское сотрудничество" #NT!
 CHI_ITA_cooperation_desc: "Экзотическое китайско-итальянское сотрудничество выросло в годы гражданской войны в Испании и китайско-японской войны. Муссолини оценил мощь лёгких танков в Испании и увеличил инвестиции в них, но для производства лёгких танков нужны вольфрамовые месторождения. Королевство Италия продало китайцам свое старое оборудование и направило туда своих специалистов и инженеров за права на китайский вольфрам и за небольшие концессии некоторым китайским портовым городам (расширился Тяньцзинь, новые — в Сямыне, Ханькоу, Ичане). После начала войны вольфрам для итальянских заводов поставлялся через Советский Союз и Иран. Когда Муссолини объявил войну Советскому Союзу (август 1941 года, через 2 месяца после начала агрессии против Советского Союза) и поставки вольфрама прекратились. Особенно когда Афганистан (под давлением Великобритании) ввел эмбарго на Королевство Италия." #NT!
 ITA_chi_cooperation: "Китайско-итальянское сотрудничество" #NT!
 ITA_chi_cooperation_desc: "Экзотическое китайско-итальянское сотрудничество выросло в годы гражданской войны в Испании и китайско-японской войны. Муссолини оценил мощь лёгких танков в Испании и увеличил инвестиции в них, но для производства лёгких танков нужны вольфрамовые месторождения. Королевство Италия продало китайцам свое старое оборудование и направило туда своих специалистов и инженеров за права на китайский вольфрам и за небольшие концессии некоторым китайским портовым городам (расширился Тяньцзинь, новые — в Сямыне, Ханькоу, Ичане). После начала войны вольфрам для итальянских заводов поставлялся через Советский Союз и Иран. Когда Муссолини объявил войну Советскому Союзу (август 1941 года, через 2 месяца после начала агрессии против Советского Союза) и поставки вольфрама прекратились. Особенно когда Афганистан (под давлением Великобритании) ввел эмбарго на Королевство Италия." #NT!
 BRA_expeditionary_force: "Бразильский экспедиционный корпус" #NT!
 BRA_expeditionary_force_desc: "Бразилия больше вовлечена в войну, чем в нашем графике. Правительство Бразилии опасается успехов держав Оси и последствий распада США и Британской империи." #NT!
 British_Empire_Focus_on_Italy: "§tБританская империя§!: §GИталия прежде всего§!" #NT!
 British_Empire_Focus_on_Italy_desc: "Королевство Италия и Муссолини — враг номер один всей Британской империи. §RДоминион Канада [CAN.GetFlag], Южно-Африканский Союз [SAF.GetFlag], Доминион Австралии [AST.GetFlag] и другие британские союзники [NZL.GetFlag] [BRA.GetFlag] [MEX.GetFlag] [YEM.GetFlag] [OMA.GetFlag] будут сосредоточены на борьбе против [ITA.GetFlag] Королевства Италия.[CAN.GetFlag]0" #NT!
