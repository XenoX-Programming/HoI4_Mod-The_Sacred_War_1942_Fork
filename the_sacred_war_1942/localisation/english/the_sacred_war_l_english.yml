#################### EVENTS
lore_events.1.t:0 "Victory?"
lore_events.1.desc:0 "The Italian strategy for World War II was based on light tanks that had been trusted by Mussolini during the Spanish Civil War. The Royal Army almost single-handedly defeated the demoralized British forces in Egypt, but the capture of Suez did not force the British Empire to capitulate. The clever British built an excellent defense in the southern areas of Egypt, which, despite many Italian attempts, could not be captured. The war has been at a standstill since 1940, and the Western Allies are only growing stronger. Mussolini understands well that the war is lost for his country, only a miracle can save Italy from disaster"
lore_events.1.a:0 "Avanti Italia!"
lore_events.2.t:0 "Sieg?"
lore_events.2.desc:0 "Before the Partition of Czechoslovakia, a German diplomat gave 'permission' for the Polish Republic to occupy Slovakia, as part of secret Polish-German negotiations. Hitler decided to cooperate with the Slovaks and provoke a Polish-Slovak war, in which Poland is the attacking side. Poland fell into this trap and the Polish Army attacked the territory of Slovakia, outrageing the West. This disrupted the Polish-French Alliance and the West's support for Poland. In September 1939, France was in a difficult political situation, declaring war on Germany on September 7, then French society was divided and more unprepared for war. France lost the war and signed a separatist peace treaty with Germany, where France was to turn into the 'Weimar Republic', humiliated and robbed. However, the British 'suggested' a better idea for Hitler. The British attacked the French fleet and fueled anti-British sentiment in France. Hitler changed his mind and decided to sign a new peace treaty so that New France would not be a "humiliated" state but a faithful ally of the German Reich. The French Social Republic declared war on the British Empire six months later when the British lost Egypt. The Japanese Empire attacked the eastern territories of the Soviet Union, which prevents the Soviet Union from conducting a counteroffensive. And the Wehrmacht is moving further"
lore_events.2.a:0 "Victory is us!"
lore_events.3.t:0 "The Darkest Hour"
lore_events.3.desc:0 "The British Empire suffered a series of devastating defeats. At Dunkirk, the Germans took 140,000 Anglo-French prisoners. The evacuation was not fully successful. Many British soldiers died at sea. Then the British Army, together with the Egyptian Army, suffered a defeat in Egypt, losing 100,000 men. The first British 'Victory' came only at the Defense of Luxor in southern Egypt, British-Egyptian units madly defended the temple of the pharaohs against Italian Light Tanks. The Battle of Britain was extremely costly for the RAF, but the front in Egypt and East Africa was frozen and tightly defended."
lore_events.3.a:0 "God Save the Empire."
lore_events.4.t:0 "The Motherland Calls Us"
lore_events.4.desc:0 "June 22, The 'Sacred War' began. The Red Army suffered a huge defeat in the first months of the war. In December 1941 the Winter Offensive was prevented due to Japanese aggression. The Wehrmacht has occupied Stalingrad and Azerbaijan's oil deposits are in danger. The Germans began to fire artillery on the Kremlin. The Turkish Army supported by the Italians attacked the Caucasus through Georgia and Armenia. Operation Silver Fox was successful and Murmansk may be captured, which may reduce Anglo-American support for the Soviet Union."
lore_events.4.a:0 "Sacred words Moscow is behind us! \nWe remember the time of Borodino."
lore_events.5.t:0 "For The Emperor!"
lore_events.5.desc:0 "The Empire of the Rising Sun achieves the greatest victory in its history. Japan is fighting the Soviet Union, China and the United States. The attack on Pearl Harbor was brilliant and deprived the United States of a powerful force, which allowed the Empire to dominate subsequent new islands in the Pacific."
lore_events.5.a:0 "Japan will be the ruler of all Asia!"
lore_events.6.t:0 "We remember Pearl Harbor!"
lore_events.6.desc:0 "The United States was attacked on December 7 by the Japanese Empire. The clever Japanese massacred the American Pacific Fleet, depriving America of its greatest strength. The European Axis Powers dominated the old continent. The Soviet Union is falling and only the United States can free the world from evil"
lore_events.6.a:0 "We can do it!"
lore_events.7.t:0 "Partition of Czechoslovakia"
lore_events.7.desc:0 "A German diplomat granted "permission" to the Republic of Poland to occupy Slovakia as part of secret Polish-German negotiations. Hitler decided to cooperate with the Slovaks  and provoke a Polish-Slovak war, in which Poland is the attacking side. Poland fell into this trap and the Polish Army attacked the territory of Slovakia, outrageing the West. This disrupted the Polish-French alliance and Western support for Poland. Polish divisions left Slovakia after bloody incidents with the Slovak Army."
lore_events.7.a:0 "Interesting"
lore_events.8.t:0 "Spanish Civil War"
lore_events.8.desc:0 "Mussolini stopped sending all his equipment to Spain, where in our timeline it ended up running out of Italian supplies that were needed for the war. Mussolini appreciated the power of tanks there and decided to invest in them. in 1939 the German Reich withdrew its aid to nationalist Spain when his anti-German attitudes were discovered. The Spanish Fascists 'Falange Española' did the same, and from that point on they moved into opposition to the Francoists. However, Franco won the civil war, which extended for 6 months."
lore_events.8.a:0 "Interesting"
lore_events.9.t:0 "Sino-Japanese War"
lore_events.9.desc:0 "Mussolini supported the Republic of China, thanks to the concession that China gave to Italy. Italy expanded its trade (Tungsten) and got some Chinese ports. The Republic of China received Italian advisors, attachés, where the Italians helped the Chinese develop a new military doctrine. So this complicated the Berlin-Rome-Tokyo Axis Alliance. Japan has conquered the most important industrial centers of China, but is unable to continue its offensive deeper into China. China has improved its army with Italian artillery and is able to create meaningful counterattacks on the front."
lore_events.9.a:0 "Interesting"
lore_events.10.t:0 "Invasion of Poland"
lore_events.10.desc:0 "Poland prolonged negotiations with Germany as long as possible, trying to resolve it peacefully. Many Poles were in favor of giving Gdańsk to Germany. Poland refused the German proposals and was attacked by Germany and the USSR. France and Great Britain declared war on Germany, invoking the Polish-French alliance, which had previously been undermined by the French government. In the Result, French public opinion was even more anti-war than it was in our timeline. German occupation policy is lighter and Polish collaboration is increasing."
lore_events.10.a:0 "Interesting"
lore_events.11.t:0 "Blitzkrieg"
lore_events.11.desc:0 "France lost the war and signed a separatist peace treaty with Germany, where France was to turn into the 'Weimar Republic', humiliated and robbed. However, the British 'suggested' a better idea for Hitler. The British attacked the French fleet and fueled anti-British sentiment in France. Hitler changed his mind and decided to sign a new peace treaty so that New France would not be a 'humiliated' state but a faithful ally of the German Reich. The British Expeditionary Force failed to evacuate and many British men were taken prisoner."
lore_events.11.a:0 "Interesting"
lore_events.12.t:0 "Campaign of Egypt"
lore_events.12.desc:0 "The Italians joined the war as it was in our timeline. The Italian army was able to capture Alexandria. British tanks were weaker than Italian ones and every battle was a disaster for the British armored forces. The British established a good defense on the Nile and had a numerical advantage over the Italians, but it did not help them and they were defeated by German tanks, which were even better than the Italian ones and managed to penetrate the British defense line. The fall of Cairo caused a decline in the morale of the British troops and half of the British who fought there were captured by the Italians, the Battle of Egypt lasted 64 days. The British established a new line of defense in southern Egypt, which was firmly fortified and not defeated. Thanks to the capture of Suez, the Italians began to support Italian East Africa. A few days later, the French Social Republic declared war on the British Empire"
lore_events.12.a:0 "Interesting"
lore_events.13.t:0 "Battle of Malta"
lore_events.13.desc:0 "The Italian forces initiated a landing operation on Malta. Despite the British mounting a desperate and unconventional defense, they managed to successfully repel the attack. The Malta Fortress became a graveyard for 25,000 Italian soldiers. This valiant defense by the British was hailed as their modern-day Thermopylae and served as potent propaganda material. Mussolini, incensed by the failure, ordered the obliteration of Malta. In response, the combined Italian-German Air Force launched a devastating aerial assault on the island, deploying 550 tactical bombers to obliterate any target in sight."
lore_events.13.a:0 "Interesting"
lore_events.14.t:0 "Operation Barbarossa"
lore_events.14.desc:0 "June 22 marked the commencement of the 'Sacred War'. The Red Army faced a significant setback in the initial months of the conflict. By December 1941, the Winter Offensive was thwarted due to Japanese aggression. Stalingrad fell to the Wehrmacht, putting the oil reserves of Azerbaijan at risk. German artillery began bombarding the Kremlin. Supported by the Italians, the Turkish Army launched an assault on the Caucasus via Georgia and Armenia. Operation Silver Fox achieved success, posing a threat to Murmansk and potentially diminishing Anglo-American aid to the Soviet Union."
lore_events.14.a:0 "Interesting"
lore_events.15.t:0 "Japan and Pearl Harbor"
lore_events.15.desc:0 "The Empire of Japan declared war against the Soviet Union (October 4), and 2 months later it attacked Pearl Harbor, which was an incredible success for Japan. The US Pacific Fleet was massacred in port, losing most of its battleships and aircraft carriers"
lore_events.15.a:0 "Interesting"
lore_events.16.t:0 "Battle of Moscow: Victory of Red Army!"
lore_events.16.desc:0 "In Second Battle of Moscow, the city faces a German onslaught, and the Red Army emerges victorious as the defenders of the homeland. \nEvery street and square in Moscow becomes a battleground, and despite immense pressure, the Red Army heroically defends its capital. The walls of the Kremlin, a symbol of steadfastness, remain untouched, and Soviet soldiers become living proof of an impregnable bastion. \nConfronting this resistance, the German war machine is halted in the heart of the country, and Moscow remains free. The Red Army's victory over the German onslaught marks a turning point in the history of the Second Battle of Moscow, symbolizing the unconquerable strength and resilience of the Soviet people in the face of the greatest threats."
lore_events.16.a:0 "Damned Reds"
lore_events.16.b:0 "We remember the Battle of Borodino! [SOV.GetFlag]"
lore_events.16.c:0 "Interesting"
lore_events.17.t:0 "Battle of Moscow: Victory of German Army!"
lore_events.17.desc:0 "The streets of Moscow, once a battleground of fierce clashes, now welcome the victorious German Army. The Red Square, witness to numerous historical events, succumbs to German control. However, Moscow, devastated and degraded, ceases to be the majestic city of pre-war times. \nThe ruins of the Kremlin, once a symbol of Soviet invincibility, now narrate a tale of destruction. The city is filled with tragic scenes where the bodies of Red Army soldiers lie on the streets, reminding onlookers of the exceptional brutality of war.This epic moment recalls similar events from Napoleon's invasion of Russia in 1812 when Moscow faced destruction, and Russians compelled the Grande Armée to confront with hunger."
lore_events.17.a:0 "Fall of the Red Tsar's House!"
lore_events.17.b:0 "Moscow will be behind us!"
lore_events.17.c:0 "Interesting"
lore_events.18.t:0 "The Second Battle of Moscow Begins"
lore_events.18.desc:0 "The Second Battle of Moscow begins as Germany launches its attack, forming lines on the city's outskirts. Moscow, a witness to past conflicts, becomes the focal point of this brutal struggle, drawing the world's attention to this strategic point where the destinies of the Eastern Front will be decided.\nMoscow, known for its heroic past, becomes the battleground where Germany faces the ultimate challenge of seizing the Russian capital. However, the formidable Red Army, commanded by Marshal Rokossovsky and leveraging its numerical advantage, stands in their way. Will Germany emerge victorious, becoming the masters of Moscow, or will Rokossovsky's numerically superior Red Army prove to be an insurmountable obstacle?"
lore_events.18.a:0 "Ok"
lore_events.19.t:0 "Offensive on Kalinin"
lore_events.19.desc:0 "Stalin ordered the higher command to recapture the city of Kalinin. Kalinin is a very important city for Moscow's security. There are industrial plants that are valuable to us in Kalinin."
lore_events.19.a:0 "Moscow Strike Back!"
lore_events.20.t:0 "Polish Army in the Soviet Union"
lore_events.20.desc:0 "The Politburo, recognizing the need for collaboration, has presented a comprehensive plan to form dedicated Polish divisions that would fight side by side with the Red Army against the common enemy. In response to German conscription policies in the western regions of Poland, where they force Polish men into the German Army, many Poles decide to resist and escape from German-controlled territories. These Polish individuals, seeking refuge and a chance to fight for their own freedom, find a welcoming haven within the ranks of the Red Army. \n\n The Polish divisions, alongside the Red Army, would engage in both offensive and defensive actions, aiming to disrupt German supply lines, recapture occupied territories, and weaken German control over the territory. Collaboration between Polish units and the Red Army would seek to achieve coordinated successes in the fight against German occupying forces."
lore_events.20.a:0 "The Slavs are now united"
lore_events.21.t:0 "Changes in combat"
lore_events.21.desc:0 "In this mod: \nLight Tanks Recon and Armored Car Recon has been buffed. \nRocket Artillery (Brigade), Medium and Heavy SP Artillery have been buffed \nOP The Volksturm path in Mobile Warfare has been nerfed (free manpower) and Germany no longer has guerrilla tactics\nMass Assault has been buffed\nConcentrated Industry has been buffed \nSoviet Union has snipers unlocked (Support Company)"
lore_events.21.a:0 "Ok"
lore_events.22.t:0 "Changes in the Soviet generals during the war."
lore_events.22.desc:0 "The attack of the Japanese Army on the Stationed Units in the Far East resulted in the decline of Zhukov's reputation. Zhukov's army was going to retreat to support the European front, but then the Japanese attacked and captured Vladivostok. In December 1941, General Rokosovsky defended Moscow and was promoted to Marshal of the Soviet Union. The Red Army was unable to create any counter-offensive and secure Moscow from the German threat due to the Japanese attack from the east. \nNikolaj Vatutin and Vasily Chuykov, who led the defense of Stalingrad, committed suicide after losing the city. \n\n 'Army Chief' Represents the Mayor Marshal of the Soviet Union, who has the greatest influence over the Red Army (just after Stalin)"
lore_events.22.a:0 "Ok"
lore_events.23.t:0 "Expansion of the Polish Army in the East"
lore_events.23.desc:0 "Freshly formed Polish divisions stand ready to confront the menace of German barbarism. These determined units have emerged as a testament to the resilience and spirit of the Polish people, rising against the oppressive forces that seek to subjugate them. With a shared commitment to defending their homeland, these divisions are poised to engage in the struggle against the German aggressors, embodying the indomitable will of the Polish nation. As they prepare to face the challenges ahead, these newly created divisions carry the hopes and aspirations of a people steadfast in their resistance against tyranny."
lore_events.23.a:0 "Long live the Polish People's Army!"
lore_events.24.t:0 "Kuibyshev a New Capital?"
lore_events.24.desc:0 "Moscow is at risk. Enemy troops once again threaten the seat of the Soviet government. A year earlier, Stalin ordered some state institutions to be located in Kuibyshev. Should we do it this time?"
lore_events.24.a:0 "The situation is serious"
lore_events.24.b:0 "Moscow will survive the second shot!"
lore_events.25.t:0 "Offensive on Stalingrad"
lore_events.25.desc:0 "Stalin ordered the highest command to recapture the Sacred city of the Soviet Union."
lore_events.25.a:0 "We will reclaim these ruins!"
lore_events.26.t:0 "Offensive on Rostov"
lore_events.26.desc:0 "Joseph Stalin has issued a new military directive, assigning us the critical task of liberating Rostov within the next 90 days. The significance of Rostov in the context of the Soviet Caucasus cannot be overstated. Despite the challenging conditions of blood, mud, and snow, the urgency of this mission is clear. The success of our forces in securing Rostov will have far-reaching implications for the overall strategic landscape, making it imperative that we overcome the obstacles and accomplish this vital objective within the specified timeframe. The sacrifices endured in this endeavor are a testament to the unwavering commitment to achieving our military goals and securing the future of the Soviet Union."
lore_events.26.a:0 "Rostov-on-Don will return to Motherland!"
lore_events.27.t:0 "Good Performance of Soviet Female Snipers"
lore_events.27.desc:0 "The reports from our Army are filled with remarkable success stories of female snipers, including Lyudmila Pavlichenko, Tatyana Kostyrina, Nina Petrova, Aliya Moldagulova, Roza Shanina, and Ziba Ganiyeva. These skilled markswomen have proven to be a formidable force, wreaking havoc among the enemy ranks and making a significant impact on the battlefield. Their precision, courage, and determination have become a source of inspiration for our forces, as they continue to contribute to the devastating blows against the enemy. The achievements of these female snipers highlight the invaluable role that women play in defending our homeland and securing victory for our cause."
lore_events.27.a:0 "Daughters of the Motherland!"
lore_events.30.t:0 "Secret Negotiations with the Turkish Government"
lore_events.30.desc:0 "The situation of Turkey in World War II is now very difficult, Turkish society does not support the war with the Soviet Union, but the government declared war on us under the pressure of the Italians and Germans. The Turkish government sees no option to withdraw its country from this war. Turkey is surrounded. The Turks come up with the idea that the Turkish Army would desert and come to our side, this is a crazy idea that would make Turkey a state occupied by the Axis. The Turks are afraid of repression and the fate of their families, so there is a second proposition,a secret agreement between the Turkish Army and the Red Army to reduce fighting between themselves to 0. What should we do?"
lore_events.30.a:0 "We sign the Secret Pact with the Turkish Army"
lore_events.30.b:0 "The entire Army should surrender to the Red Army."
lore_events.30.c:0 "What do we care about your fate?"
lore_events.31.t:0 "The Turkish Army surrenders to the Soviets"
lore_events.31.desc:0 "The situation of Turkey during World War II was very difficult, Turkish society did not support the war with the Soviet Union and the alliance with Italy, but the government entered the war under pressure from the Italians and Germans. The Turkish government sees no possibility of withdrawing its country from this war. The Turkish Army, tired of war, surrendered to the Red Army, signed a secret White Peace with the Soviet Union, but German-Italian Agents followed this and the Combined Axis Armies launched a brutal Invasion of Turkey."
lore_events.31.a:0 "Interesting"
lore_events.32.t:0 "Stalingrad Shrouded in Smoke"
lore_events.32.desc:0 "After a fierce battle, Stalingrad stands as a ruined city, shrouded in the smoke of war. This symbolic city, which became the arena of one of the bloodiest battle of war, now presents a picture of destruction and tragedy. The ruins of buildings and remains of fierce fighting remind us of the huge price that the city's population paid during this painful confrontation. Stalingrad, although destroyed, remains a lasting witness to the heroic defense and the tragic events that took place during this long battle."
lore_events.32.a:0 "a German New Order,"
lore_events.33.t:0 "Spain in the Axis"
lore_events.33.desc:0 "With the fall of the Soviet Union we can sway more countries to join our side. Spain would be interested to join if we promised them the control of Gibraltar and French possesions in Morocco."
lore_events.33.a:0 "Ask them to join"
lore_events.33.b:0 "Don't"
lore_events.34.t:0 "Spain in the Axis"
lore_events.34.d:0 "Germans have conquered the entire Soviet Union and are now proposing us the alliance against what's left of the Allies."
lore_events.34.a:0 "We have no power to stop the Germans anymore..."
lore_events.34.b:0 "Refuse"
lore_events.35.t:0 "Stalin's speech in Moscow"
lore_events.35.desc:0 "In the Shadow of the Defense of Moscow, behind the backs of thousands of Red Army soldiers. Stalin spoke to the Russians who decided to stay in the capital. 'Our Motherland defeated the Mongol horde, the French horde, and will defeat the fascist horde!'"
lore_events.35.a:0 "Urra!"
lore_events.36.t:0 "Winter Offensive in Africa"
lore_events.36.desc:0 "In the face of a weakening Italian Army in North Africa's desert terrain, the British Empire is preparing for decisive action to break through Italian defenses and open a route to Cairo. This strategic offensive aims to change the course of the war in this theater and enable the Allies to capture a crucial desert region.\nThe primary goal of this offensive is to break through the Italian defense, opening a route to Cairo. Success will provide the British Empire a key advantage in the region, allowing for further advancements on the Mediterranean fronts.\n Now on the defensive, the Italian Army faces a determined British attack, while German forces are heavily engaged on the Eastern Front. Limited access to support from Germany poses a challenging choice for Italian commanders, compelling them to defend their positions."
lore_events.36.a:0 "Interesting"
lore_events.37.t:0 "Mussolini's Army holds Egypt"
lore_events.37.desc:0 "Everything indicates that the Allied Offensive did not retake Cairo from the Italians. Silence has fallen in Africa, no artillery shells can be heard. In Italy, Mussolini delivered to the Italian Army Speech 'We will defend Egypt with tooth and nail. We will make Egypt a graveyard of Anglo-Americans, Until all Africa becomes Italian'. The enthusiasm that collapsed in Italy after the failed previous offensives (Malta, Nairobi, North Sudan) returns to the Italian spirit"
lore_events.37.a:0 "The Anglo-Americans will not pass"
lore_events.37.b:0 "Damned Italians"
lore_events.37.c:0 "Interesting"
lore_events.38.t:0 "The Liberation of Cairo"
lore_events.38.desc:0 "The Egyptian sand, for a long time covered with the blood of soldiers, became the site of the Allied triumph over the Italian army.\nAfter many heroic battles, the determined Allied forces defeated the Italian Army, transforming the Egyptian battlefields into the arena of their triumph.\n\n What consequences will this defeat have for the fascist rule in Rome and for the entire African front? Time will tell whether the Allies will be able to use this victory to defeat the Axis forces"
lore_events.38.a:0 "Damned Anglosaxons"
lore_events.38.b:0 "Victory of Freedom"
lore_events.38.c:0 "Interesting"
lore_events.39.t:0 "Operation Torch: American Landing on the Coasts of French North Africa"
lore_events.39.desc:0 "As part of Operation Torch, the United States Armed Forces successfully conduct a landing on the shores of French Morocco and Algeria, reshaping the power dynamics in the region. The landing not only opens a new front against the Axis but also poses a threat to Italian possessions in North Africa. \nDuring the operation, American forces encounter minimal resistance from French troops, further solidifying their position in this crucial theater of war. Will this strategic intervention yield the expected results, or will the fate of Operation Torch take unexpected turns?"
lore_events.39.a:0 "Interesting"
lore_events.41.t:0 "Italian Civil War"
lore_events.41.desc:0 "Amidst the growing discontent and loss of faith in fascist ideals and Mussolini as its icon, Italy finds itself on the brink of internal conflict. People have ceased to believe in fascist ideologies, and tensions within society have reached a critical point. \n\nThe Italian Civil War is the result of abandoning the long-standing foundations of fascism and the decline of Mussolini's authority. The society, no longer unanimously divided by ideological principles, now faces a choice – stick to the existing beliefs or seek a new path for the country's future."
lore_events.41.a:0 "Ohh"
lore_events.42.t:0 "Italian Civil War"
lore_events.42.desc:0 "Amidst the growing discontent and loss of faith in fascist ideals and Mussolini as its icon, Italy finds itself on the brink of internal conflict. People have ceased to believe in fascist ideologies, and tensions within society have reached a critical point. \n\nThe Italian Civil War is the result of abandoning the long-standing foundations of fascism and the decline of Mussolini's authority. The society, no longer unanimously divided by ideological principles, now faces a choice – stick to the existing beliefs or seek a new path for the country's future."
lore_events.42.a:0 "Interesting!"
lore_events.43.t:0 "Liberation of Stalingrad"
lore_events.43.desc:0 "The heroic sacrifice of Soviet soldiers sweeps away the German occupation from Stalingrad, and the city's ruins bear witness to the relentless struggle and vengeance. German forces, compelled to retreat by the unwavering might of the Red Army, give way to the flames of liberation. Despite the devastation, the residents of Stalingrad celebrate the arrival of the Red Army as a symbol of triumph over tyranny. Each shot and explosion in the town becomes a hymn of rebuilding and retribution, restoring the spirit of a nation that German occupational rule sought to crush."
lore_events.43.a:0 "Interesting"
lore_events.44.t:0 "Liberation of Sevastopol"
lore_events.44.desc:0 "As a result of fierce battles and intense artillery bombardment by the Red Army, Sevastopol was liberated from German occupation in a heroic struggle. Although the city suffered damage during the fighting and bombings, its residents welcome the Red Army with gratitude as their liberators. German forces, resisting fiercely, had to yield to the determination of the Red Army, enabling the local population to regain their freedom. Each step after liberation holds the promise of a better future, despite the destruction left behind by the brutal clashes."
lore_events.44.a:0 "Interesting"
lore_events.45.t:0 "Liberation of Smolensk"
lore_events.45.desc:0 "As a result of fierce battles and intense artillery bombardment by the Red Army, Smolensk was liberated from German occupation in a heroic struggle. Despite the destruction caused by the fighting and bombings, the inhabitants welcome the Red Army with gratitude. German forces, especially the Ukrainian Waffen-SS Division, put up significant resistance, but the determination of the Red Army prevailed, allowing the local population to regain their freedom."
lore_events.45.a:0 "Interesting"
lore_events.46.t:0 "Liberation of Minsk"
lore_events.46.desc:0 "In the dramatic war symphony of Smolensk, besieged by the cruelty of German occupation, it became a place of heroic struggle. The Red Army, overcoming German brutality, liberated the city. Despite the losses, the residents welcome their red liberators. Each step after liberation holds a promise of a better future, despite the destruction left behind by German brutality."
lore_events.46.a:0 "Interesting"
lore_events.47.t:0 "Liberation of Kiev"
lore_events.47.desc:0 "At a key moment in history, Kiev, strongly defended by the Germans, falls to the Red Army, which thwarts German plans to hold the city. The fight was fierce, but the determination of the Red Army and a well-coordinated strategy brought victory. German troops must accept defeat when the flag of the Red Army triumphantly flies over the captured areas. However, with liberation also comes the bitter taste of the destruction that the war left in the ruined city. As the people of Kiev taste freedom, they are also left with the task of reconstruction and the challenges that come with it."
lore_events.47.a:0 "Interesting"
lore_events.48.t:0 "The French Liberation Army was created"
lore_events.48.desc:0 "In response to the oppressive rule of the French Social Republic and aiming to liberate the homeland from the fascist regime, the French Liberation Army has emerged. This heroic force unites citizens who aspire to regain independence and restore democracy in France. \nThe Liberation Army's objective is to overthrow the oppressive regime and restore national sovereignty. Its soldiers, imbued with the spirit of freedom, confront the regime with determination, ready to sacrifice everything to regain their country's freedom and dignity. \nThe struggle of the French Liberation Army is not just an armed conflict but also a fight for the values that have always been the foundation of French society."
lore_events.48.a:0 "Interesting"
lore_events.49.t:0 "Liberation of Kharkov"
lore_events.49.desc:0 "Red Army boldly entered Kharkov, forcing the German Army into a rapid retreat deep into Ukraine. The city, which had previously succumbed to German occupation, now celebrates its liberation from the enemy's yoke. \nThe Red Army, supported by tanks, sealed their determination by smashing through German defensive lines around Kharkov. This strategic victory alters the course of the war on the Eastern Front, compelling the Germans to make difficult decisions in the face of the growing pressure from the Soviet offensive. \nKharkov, once a witness to bitter battles, now welcomes liberators with enthusiasm. As German forces withdraw, the streets of the city begin to revive from the war's destruction, and the citizens rejoice in the recovery of their freedom."
lore_events.49.a:0 "Interesting"
lore_events.50.t:0 "Liberation of Rostov"
lore_events.50.desc:0 "The Red Army decisively entered Rostov-on-Don, liberating the city from German occupation. \nThe city celebrates its return to freedom as the Red Army, supported by powerful armored and mechanized forces, takes back Rostov-on-Don from German hands. However, in the wake of the retreating Germans, the military synagogue in Rostov-on-Don becomes a victim of destruction as the enemy subjects it to the ground. /nWhile withdrawing to Ukraine, the Germans, compelled to abandon the city, do not hesitate to employ drastic measures, destroying symbolic structures. Rostov-on-Don, despite regaining its freedom, bears the cost of destruction left behind by the retreating German forces."
lore_events.50.a:0 "Interesting"
lore_events.51.t:0 "Serious meeting of the General Staff of the Red Army"
lore_events.51.desc:0 "A serious meeting was held in a secret bunker of the General Staff of the Red Army, where Joseph Stalin expressed his concern and disappointment with the current situation on the Eastern Front, including the fall of Stalingrad, the ongoing encirclement of Leningrad, and the enemy's approach to Moscow. \nStalin also expressed his doubts about the effectiveness of the current Deep Battle Doctrine. \n\nDuring the meeting, Marshal Rokossovsky expressed his belief that the Deep Battle Doctrine still has potential, but there is a need to adapt it to the changing situation on the front.\n Rokossovsky postulated that the Red Army should develop mechanized infantry divisions that would be both mobile and sufficiently armored, enabling an effective attack on fascist positions. \nThe Marshal emphasized that the infantry should maintain close contact with the enemy, minimizing the chances of the Germans using artillery and aviation against their troops. \nDespite his disappointment with the situation, Rokossovsky was determined to adapt the Red Army's strategy to increase the effectiveness of offensive operations. \n\nDuring the meeting, Marshal Georgy Zhukov expressed his belief that the Deep Battle Doctrine remains an effective tool, but at the same time suggested changes in the war strategy. Zhukov emphasized the need for mass mobilization of the population, waging war on the principle of exhausting the enemy. Due to the Soviet Union's industrial limitations, Zhukov recommended a logistical-guerrilla war. According to Zhukov, support for guerrilla movements that would destroy railway lines and build fortifications would be crucial. \nMoreover, Zhukov pointed to the need to train soldiers to fight in various weather and terrain conditions, as well as to focus on the production of tanks that could be produced quickly and operate effectively in key moments of the conflict."
lore_events.51.a:0 "Marshal Rokossovsky is right"
lore_events.51.b:0 "Marshal Zhukov is right"
lore_events.52.t:0 "Uprising in the Balkans"
lore_events.52.desc:0 "Jugoslav Partisans, under the leadership of Josip Broz Tito, orchestrated a widespread uprising across the Balkan region. The insurgency aimed to disrupt and dismantle Axis control, leading to significant damage to crucial infrastructure and railway lines throughout the Balkans. The Partisans' guerrilla tactics and resilience posed a formidable challenge to Axis forces, marking a notable chapter in the resistance against occupation in the region."
lore_events.52.a:0 "Assholes"
lore_events.55.t:0 "The Siege of Leningrad is lifted"
lore_events.55.desc:0 "The siege of Leningrad was finally lifted. The Red Army, overcoming the German defensive lines, managed to break through to the surrounded city. The months-long blockade and suffering of the people of Leningrad came to an end when Soviet forces broke through German fortifications, restoring connections with the rest of the country. This breakthrough moment meant not only a military victory, but also ending the agony of the city's population and restoring normality in the region."
lore_events.55.a:0 "Interesting"
lore_events.57.t:0 "Chuikov's heroism"
lore_events.57.desc:0 "Vasily Chuikov, the general of the 62nd Army of the Soviet Union, who fiercely defended Stalingrad with all his might, met his end in the city on the last day of battle. As the Germans secured a foothold on the right bank of the Volga, penetrating the eastern part of Stalingrad, Vasily Chuikov and his closest associates took up arms and personally fought against the Nazis. Vasily Chuikov perished in Stalingrad on October 19/20, 1942. His body was likely thrown into the Volga."
lore_events.57.a:0 "The Motherland is proud of you"
lore_events.58.t:0 "Carro Armato L6/42"
lore_events.58.desc:0 "Throughout the war, the Italians failed to develop effective, reliable medium tanks. Instead, they relied on medium tanks supplied to them by the Germans or acquired from the enemy. Sometimes there were even situations where Soviet T-34 tanks appeared on the front in Egypt. Since the Spanish Civil War, light tanks had been developed and had evolved enough to cope with British medium tanks."
lore_events.58.a:0 "Ok"
lore_events.64.t:0 "Anti-Soviet sentiments in Central Asia"
lore_events.64.desc:0 "In Central Asia, anti-Soviet sentiments are on the rise, deepening with the growing discontent of the population towards Soviet dominance. Increasing resistance movements and aspirations for independence are observed, making the region increasingly unstable. Additionally, more and more Muslim populations are being conscripted into military service, further exacerbating tensions and potentially leading to serious consequences for Soviet authority in the region. Resistance movements are fueled by Germans and Turks, who support local opposition groups against Soviet presence."
lore_events.64.a:0 "Bastards!"
lore_events.65.t:0 "The Bukhara Liberation Movement"
lore_events.65.desc:0 "The Bukhara Liberation Movement, led by local activists and patriots, aims to establish an independent state in Central Asia. Its members actively oppose our occupation, believing that the collapse of the Soviet Union is possible due to the advancing German forces. Their efforts are geared towards achieving sovereignty for Bukhara and liberation from our dominance."
lore_events.65.a:0 "Bastards!"
lore_events.66.t:0 "Joseph Stalin disappeared"
lore_events.66.desc:0 "During the fierce battle against the German fascist forces, a sudden and mysterious absence of Stalin, the leader of the Soviet Union. No one has seen Stalin for 10 days, and despite intensive searches conducted by the NKVD, his fate remains unknown. Speculations about his fate are diverse, but among the population, there is a belief that he may have fallen victim to murder. Stalin's disappearance raises many questions and concerns, especially in the face of the crucial role he played in directing the defense of our the country."
lore_events.66.a:0 "An assassination attempt on Stalin?"
lore_events.67.t:0 "Coup d'état of the Red Army"
lore_events.67.desc:0 "The highest rank officers and generals of the Red Army began to act, Red Army units managed to take control of key strategic points in the country (Kuybyshev, Gorky, Kazan and Sverdlovsk). The local military garrisons, loyal to the new leadership, quickly hand over control of these centers. \nAt the same time, clashes broke out between units of the National Commissariat of Internal Affairs (NKVD), subordinated to the previous government, and rebels supporting the coup. Fighting takes place in many cities and surrounding areas, leading to losses on both sides. \nIn response to the developments, Lavrentiy Beria, head of the NKVD, issues an order to his NKVD troops, ordering them to mobilize and join the coup. This decision significantly increases the strength and reach of the movement carried out by the conspirators. \nAt the same time, Radio Moscow, controlled by the rebels, broadcasts special messages declaring readiness to sign an armistice with Germany. This unusual announcement is causing a number of reactions and controversies, both at home and abroad. \nIn the face of the political and militaristic turmoil caused by the coup, the Soviet Military Council announces that it will now govern the Soviet Union. This landmark announcement aims to restore stability and order to the country in the face of growing chaos."
lore_events.67.a:0 "Another Revolution?"
lore_events.68.t:0 "Moscow Conference"
lore_events.68.desc:0 "A peace conference was held in Moscow, which is controlled by the Germans, to sign a treaty ending the German-Soviet War. The German priority was to establish a border along the Astrakhan-Arkhangelsk Line, which runs from Astrakhan in the south to Arkhangelsk in the north. However, after long negotiations, Hitler agreed to some concessions. The new German border line bypasses cities such as Saratov, Gorky, Kazan, Kuibyshev and Astrakhan. This decision was due to the fact that the Germans noticed the enormous resistance from the Slavs and realized that maintaining control over such vast areas would be difficult due to frequent partisan attacks. The 'Bitter Peace' has been signed"
lore_events.68.a:0 "The end of war..."
lore_events.69.t:0 "Peace in the Far East"
lore_events.69.desc:0 "There was no Japanese representation at the Moscow conference, which indicated that this country was not included in the peace agreement by either Germany or the USSR.\nThe Soviet Military Council decided to concentrate its efforts on obtaining the most favorable peace possible and on putting pressure on the Japanese. The idea was to convince them that the Soviet Union, even though it had ended the fight against Germany on the Eastern Front, still had the ability and readiness to wage a regular war with Japan. \nThe Japanese gave up their earlier idea of expanding their sphere of influence westward, towards Lake Baikal. Instead, they contented themselves with territories in the far east, namely the Transamur region, the island of Sakhalin and the southern part of Kamchatka."
lore_events.69.a:0 "Ok"
lore_events.70.t:0 "The New Stavka Directive"
lore_events.70.desc:0 "It is desperately important to the party leadership that the Red Army wins. Both Rokossovsky and Zhukov are in a difficult situation, so we must do everything to ensure Stalin's victory. \n\nThe first idea is to concentrate on Mikhaylovka, in the Stalingrad district, because we think that our army has the best chance of victory there, especially against the Hungarian and Italian Divisions that hold key positions in this area. \nThe second idea is to focus on Kalinin, in the Kalininsky district. We feel this is the most difficult option for our forces, but it would be the most satisfying victory for the Soviet Union and would secure Moscow's flank. \nThe third idea is Astrakhan - the Astrakhan district, we think this is the best option, maybe not easier, but it will open the logistics for the liberation of the Caucasus."
lore_events.70.a:0 "Mikhaylovka Offensive"
lore_events.70.b:0 "Kalinin-Klin Offensive"
lore_events.70.c:0 "Astrakhan Offensive"
lore_events.71.t:0 "The New Stavka Directive"
lore_events.71.desc:0 ""
lore_events.71.a:0 "Mikhaylovka Offensive"
