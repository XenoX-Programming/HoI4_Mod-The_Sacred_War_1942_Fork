#################### BOOKMARKS 
 TURNING_TIDE_NAME:0 "The Sacred War"
 TURNING_TIDE_DESC:0 "The Battle of the Caucasus is taking place and it looks like the Soviet Union has been defeated. Turkish troops are approaching from Georgia. The Italian Campaign in East Africa is very bloody. The battle for the Mediterranean is indecisive. In the Far East, Japan struggles with China and the Soviet Union. The American Navy is rebuilding after the attack on Pearl Harbor"
 ENG_TURNING_TIDE_DESC:0 "The disgrace at Dunkirk and the Fall of Egypt along with the Suez Canal was a great blow to the Empire. However, the Heroic and Mad Defense of Malta against Italian troops (March 1942) gave the British further will to fight. After a great defeat, the British army is reborn and ready to attack Egypt. The Germans, preparing for Operation Fall Blau, left Egypt, leaving only the Italians and French there. The Italian Light Tanks that defeated the British Army now have no chance against the new British medium tanks."
 FRA_TURNING_TIDE_DESC:0 "The French Social Republic was founded in 1941 when Marshal Petain was dismissed by the Germans for refusing to declare war against Great Britain.  Doriot decided to call the state a 'Social Republic' and implemented pro-socialist economic reforms to gain support from the socialists.  Conservatives and Right-wing politicians do not support the current regime in France."
 GER_TURNING_TIDE_DESC:0 "The triumph of the Third Reich is on the horizon as the Anti-Communist Crusade approaches its conclusion. Despite the enemy's overwhelming numerical advantage, the Wehrmacht continues its advance, capturing additional cities in the Soviet Union. The British Empire is about to lose all hope in the face of these relentless victories."
 ITA_TURNING_TIDE_DESC:0 "The Kingdom of Italy was victorious in Alexandria and then on the Nile, capturing thousands of British and Egyptians. However, the speed of the offensive waned and stopped in southern Egypt, where the British established a new line of defense. In East Africa, the Italians captured Nairobi in a bloody battle. The United States has joined the war and this is a turning point in Africa because now Italy will have to defend itself."
 JAP_TURNING_TIDE_DESC:0 "The Empire of the Rising Sun is engaged in a conflict with the Soviet Union, the United States, and the Republic of China. The attack on Pearl Harbor stands as the most significant military triumph in history. Nevertheless, the American fleet is in the process of reconstruction."
 SOV_TURNING_TIDE_DESC:0 "The past two years have marked a catastrophic period for the Soviet Union, with staggering losses totaling 8 million people. The Red Army faced a devastating defeat at the hands of the German Army. The strategic significance of Azerbaijan, a crucial source of oil for the Soviet Union, raises concerns as it may fall into enemy hands."
 USA_TURNING_TIDE_DESC:0 "The United States fleet faced near-annihilation in the infamous Japanese attack on Pearl Harbor. Yet, this did not signal the end of American involvement in the war. The USA retains its position as possessing the world's largest industry and significant oil reserves."
 OTHER_TURNING_TIDE_DESC:0 "The nations of the world, great and small, will be affected by this conflict that spans across several continents around the world."
