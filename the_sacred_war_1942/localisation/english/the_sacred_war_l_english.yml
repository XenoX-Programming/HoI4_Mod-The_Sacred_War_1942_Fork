#################### IDEAS
imperial_protection:0 "British Protection"
imperial_protection_desc:0 "The war became a tragedy for the British Empire. The Empire must use all possible means to defend itself. The British Empire will have to repay this in the future"
Armistice_of_22_June_1940:0 "Armistice of 22 June 1940"
Armistice_of_22_June_1940_desc:0 "Peace terms were initially intended to kill the French arms and civilian industries. Humiliate the French and reduce people to the poverty that the Treaty of Versailles brought to Germany. However, the war situation changed the Germans' minds and the treaty was softened, only to strategic raw materials and factories"
FRA_antistate_resistance:0 "Antifascist Resistance"
FRA_antistate_resistance_desc:0 "French society is united against the new Fascist Regime. They have wide support in society and slow down the industry."
FRA_fascist_communist_ally:0 "Alliance with the Communists"
FRA_fascist_communist_ally_desc:0 "Conservatives and some nationalists (Petain's supporters) do not want to support the new government, so Doriot, who is a former communist, decided to introduce socialist reforms to gain the support of socialists"
FSR_socialist_economy:0 "Socialist Economy"
FSR_corporatist_economy:0 "Corporatist Economy"
TUR_in_axis:0 "Turkey in Axis"
TUR_in_axis_desc:0 "In the 1930s and 1940s, Mussolini's Italy adopted a pro-Turkish policy aimed at inviting Turkey into Italian influence. Mussolini visited Turkey many times and signed friendly agreements on his own initiative. When Greece was conquered, he offered some of the Greek islands to Turkey, but Ankara refused. in 1942 the Turkish Republic joined the Axis and declared war on the Soviet Union. This is a good opportunity for Turkey to destroy the Kurdish resistance and reject the debt"
TUR_ITA_cooperation:0 "Italian-Turkish Cooperation"
CHI_ITA_cooperation:0 "Sino-Italian Cooperation"
CHI_ITA_cooperation_desc:0 "Exotic Sino-Italian cooperation grew during the years of the Spanish Civil War and the Sino-Japanese War. Mussolini appreciated the power of light tanks in Spain and increased investment in them, but the production of light tanks requires tungsten deposits. The Kingdom of Italy sold its old equipment to the Chinese and sent its specialists and engineers there for the rights to Chinese tungsten and for small concessions for some Chinese port cities (Tianjin expanded, new ones in Xiamen, Hankou, Yichang). After the outbreak of the war, tungsten for Italian factories was supplied via the Soviet Union and Iran. When Mussolini declared war on the Soviet Union (August 1941, 2 months after the beginning of the aggression against the Soviet Union) and the supply of tungsten stopped. Especially when Afghanistan (under British pressure) imposed an embargo on the Kingdom of Italy."
ITA_chi_cooperation:0 "Sino-Italian Cooperation"
ITA_chi_cooperation_desc:0 "Exotic Sino-Italian cooperation grew during the years of the Spanish Civil War and the Sino-Japanese War. Mussolini appreciated the power of light tanks in Spain and increased investment in them, but the production of light tanks requires tungsten deposits. The Kingdom of Italy sold its old equipment to the Chinese and sent its specialists and engineers there for the rights to Chinese tungsten and for small concessions for some Chinese port cities (Tianjin expanded, new ones in Xiamen, Hankou, Yichang). After the outbreak of the war, tungsten for Italian factories was supplied via the Soviet Union and Iran. When Mussolini declared war on the Soviet Union (August 1941, 2 months after the beginning of the aggression against the Soviet Union) and the supply of tungsten stopped. Especially when Afghanistan (under British pressure) imposed an embargo on the Kingdom of Italy."
BRA_expeditionary_force:0 "Brazilian Expeditionary Force"
BRA_expeditionary_force_desc:0 "Brazil is more involved in the war than in our timeline. The Brazilian government is afraid of the successes of the Axis powers and the consequences of the collapse of the United States and the British Empire."
British_Empire_Focus_on_Italy:0 "§tThe British Empire§!: §GItaly First§!"
British_Empire_Focus_on_Italy_desc:0 "The Kingdom of Italy and Mussolini are the number one enemy of the entire British Empire. §RThe Dominion of Canada [CAN.GetFlag], the Union of South Africa [SAF.GetFlag], the Dominion of Australia [AST.GetFlag] and other british allies [NZL.GetFlag] [BRA.GetFlag] [MEX.GetFlag] [YEM.GetFlag] [OMA.GetFlag] will be focused on fighting against [ITA.GetFlag] Kingdom of Italy.§!"
British_Armed_Forces:0 "British National Spirits"
British_Armed_Forces_desc:0 "§GAll national spirits merged into one national spirit§!"
