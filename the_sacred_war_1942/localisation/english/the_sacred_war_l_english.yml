TUR_secret_agreement_with_Red_Army:0 "Secret Agreement with §RRed Army§!"
Stalins_Paranoia_Reborns:0 "§RStalin does not trust generals§!"
Stalins_Paranoia_Reborns_desc:0 "Our war defeats have made Joseph Stalin question the competence of his generals and he has to disturb his generals in all cases, often deciding for them. The NKVD checks every general to see if he is a fascist agent."
we_are_army_of_the_people_spirit:0 "§YWe Are the Army of the People§!"
ITA_demoralized_army:0 "Demoralized Army"
ITA_demoralized_army_desc:0 "The Italians are a nation hungry for success, once convinced by fascist authorities that the war would be short-lived. Almost three years have passed, and the end of the war seems elusive. Italian soldiers are sent like cannon fodder to Kenya, Malta, Russia, and Egypt. Italy finds itself in conflict with the United States, a country Italians love where their families reside. Reluctance toward the war is fueled by the realization that the enemy is technologically more advanced than Italy in every aspect. In this protracted struggle, Italy finds itself consistently outmatched."
FRA_konsekwencje_upadku_francji:0 "Fall of Mainland France"
FRA_konsekwencje_upadku_francji_desc:0 "Rapid defeat of France was a shock for the French, who were not willing for war and hesitant to aid Poland. Now they found themselves under the fascist regime in Europe. Free France, on the other hand, struggled to gain international recognition. The United States reluctantly acknowledged Free France, while returning French territories in Central and North America, as well as Guyana. The invasion of British and Allied forces into French West Africa contributed to the establishment of Free France."
