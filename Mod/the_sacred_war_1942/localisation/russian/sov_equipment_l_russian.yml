 SOV_medium_tank_equipment_3: "Т-34-85" #NT!
 SOV_medium_tank_equipment_3_short: "Т-34-85" #NT!
 SOV_medium_tank_equipment_3_desc: "Последняя модификация танка Т-34 1943 года. Новая трехместная орудийная башня позволяла установить более мощную 85-мм пушку. Это значительно повысило боевую эффективность танка по сравнению с его предшественником Т-34-76. Всего было выпущено более 35 000 экземпляров в нескольких вариантах. Сегодня танк по-прежнему находится на вооружении ряда стран." #NT!
  
  # Soviet medium SPG 
 SOV_medium_tank_destroyer_equipment_1: "СУ-8-85" #NT!
 SOV_medium_tank_destroyer_equipment_1_short: "СУ-8-85" #NT!
 SOV_medium_tank_destroyer_equipment_1_desc: "СУ-8-85 — проект истребителя танков. 85-мм танковая пушка Ф-30 разместилась в корпусе на базе шасси Т-28." #NT!
 SOV_medium_tank_destroyer_equipment_2: "СУ-85" #NT!
 SOV_medium_tank_destroyer_equipment_2_short: "СУ-85" #NT!
 SOV_medium_tank_destroyer_equipment_2_desc: "СУ-85 — средняя по массе противотанковая самоходно-артиллерийская система, относящаяся к классу истребителей танков. СУ-85 создана на базе среднего танка Т-34 и запущена в серию летом 1943 года. Всего было построено 2337 САУ. 85-мм пушка Д-5С позволяет СУ-85 эффективно бороться со средними танками противника на дальностях более километра и на меньших дистанциях пробивать лобовую броню тяжелых танков." #NT!
 SOV_medium_tank_destroyer_equipment_3: "СУ-100" #NT!
 SOV_medium_tank_destroyer_equipment_3_short: "СУ-100" #NT!
 SOV_medium_tank_destroyer_equipment_3_desc: "СУ-100 — противотанковая самоходно-артиллерийская установка (Истребитель танков). Создан на базе среднего танка Т-34-85 конструкторским бюро Уралмашзавода в конце 1943 года как дальнейшее развитие СУ-85 (из-за неспособности бороться с немецкими тяжелыми танками). Основным вооружением СУ-100 была 100-мм пушка Д-10С." #NT!
 SOV_medium_tank_aa_equipment_1: "ЗСУ-8-76" #NT!
 SOV_medium_tank_aa_equipment_1_short: "ЗСУ-8-76" #NT!
 SOV_medium_tank_aa_equipment_1_desc: "СУ-8-76 — зенитная самоходная установка, созданная на базе шасси Т-28. Вместо башни в передней части корпуса устанавливалась 76,2-мм зенитная пушка 3К." #NT!
 SOV_medium_tank_aa_equipment_2: "ЗСУ-37-34" #NT!
 SOV_medium_tank_aa_equipment_2_short: "ЗСУ-37-34" #NT!
 SOV_medium_tank_aa_equipment_2_desc: "ЗСУ-37-34 — зенитная самоходная установка, построенная на базе Т-34. Оснащен новой башней конструкции Савина и вооружен 37-мм зенитной пушкой обр. 1939 год" #NT!
 SOV_medium_tank_aa_equipment_3: "Ю-20" #NT!
 SOV_medium_tank_aa_equipment_3_short: "Ю-20" #NT!
 SOV_medium_tank_aa_equipment_3_desc: "У-20 — проект САУ. На шасси Т-34 была установлена ​​открытая башня с экипажем из трех человек. В качестве вооружения использовалась 85-мм зенитная пушка 52-К." #NT!
 SOV_medium_tank_artillery_equipment_1: "СУ-8-152" #NT!
 SOV_medium_tank_artillery_equipment_1_short: "СУ-8-152" #NT!
 SOV_medium_tank_artillery_equipment_1_desc: "СУ-8-152 — самоходная артиллерийская установка на базе шасси Т-28 и вооруженная 152-мм гаубицей." #NT!
 SOV_medium_tank_artillery_equipment_2: "СУ-122" #NT!
 SOV_medium_tank_artillery_equipment_2_short: "СУ-122" #NT!
 SOV_medium_tank_artillery_equipment_2_desc: "СУ-122 представляла собой самоходную гаубицу или штурмовое орудие. Число «122» в обозначении обозначает калибр основного вооружения — 122-мм гаубицы М-30С. Шасси было от Т-34." #NT!
 SOV_medium_tank_artillery_equipment_3: "СУ-Д-15" #NT!
 SOV_medium_tank_artillery_equipment_3_short: "СУ-Д-15" #NT!
 SOV_medium_tank_artillery_equipment_3_desc: "СУ-Д-15 — средняя самоходка с вооружением в виде 152-мм гаубицы Д-15. Гаубица устанавливалась в корпусе и вела стрельбу снарядами массой 40–49 кг. Ее можно квалифицировать как замену СУ-122, у которой недостаточно мощности для эффективного поражения тяжелых немецких танков." #NT!
